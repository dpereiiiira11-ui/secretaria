function Profissionais({ data, onAdd, onUpdate, onRemove }) {
  const { professionals, appointments } = data;
  const [addingName, setAddingName] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [adding, setAdding] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editingName, setEditingName] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");

  async function addProfessional(e) {
    e.preventDefault();
    if (!addingName.trim()) return;
    setAdding(true); setError("");
    try {
      await onAdd({ nome: addingName.trim(), foto_url: null });
      setAddingName(""); setShowAdd(false);
    } catch (err) { setError(err.message); }
    finally { setAdding(false); }
  }

  function startEditName(p) { setEditingId(p.id); setEditingName(p.nome); }

  async function saveName(id) {
    if (!editingName.trim()) return;
    setBusyId(id); setError("");
    try { await onUpdate(id, { nome: editingName.trim() }); setEditingId(null); }
    catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  function changePhoto(p, file) {
    if (!file) return;
    if (file.size > 900000) { alert("Escolha uma foto menor que 900 KB."); return; }
    setBusyId(p.id); setError("");
    const reader = new FileReader();
    reader.onload = async () => {
      try { await onUpdate(p.id, { foto_url: String(reader.result) }); }
      catch (err) { setError(err.message); }
      finally { setBusyId(null); }
    };
    reader.readAsDataURL(file);
  }

  async function toggleAtivo(p) {
    setBusyId(p.id); setError("");
    try { await onUpdate(p.id, { ativo: !p.ativo }); }
    catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  async function remove(p) {
    setBusyId(p.id); setError("");
    try {
      await onRemove(p.id);
      if (editingId === p.id) setEditingId(null);
    } catch (err) {
      setError(/foreign key|violat/i.test(err.message)
        ? "Não é possível excluir: esta profissional tem agendamentos no histórico. Desative-a em vez de excluir."
        : err.message);
    }
    finally { setBusyId(null); }
  }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Equipe</h1>
      <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 16, lineHeight: 1.5 }}>
        Cada profissional aparece no link público de agendamento e tem sua própria agenda e horários. Toque na foto pra trocar.
      </div>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      {professionals.length === 0 && !showAdd ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13, marginBottom: 12 }}>Nenhuma profissional cadastrada ainda.</Card>
      ) : (
        <Card style={{ padding: 4, overflow: "hidden", marginBottom: 12 }}>
          {professionals.map((p, i) => {
            const total = appointments.filter(a => a.profissionalId === p.id && a.status !== "cancelado").length;
            const busy = busyId === p.id;
            const isEditingName = editingId === p.id;
            return (
              <div key={p.id} className="sd-row" style={{
                display: "flex", alignItems: "center", gap: 12, padding: "13px 12px",
                borderBottom: i < professionals.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
                opacity: busy ? 0.6 : 1,
              }}>
                <label style={{ position: "relative", display: "inline-block", cursor: "pointer", flexShrink: 0 }}>
                  <Avatar name={p.nome} size={44} photoUrl={p.fotoUrl} />
                  <span style={{
                    position: "absolute", bottom: -2, right: -2, width: 19, height: 19, borderRadius: "50%",
                    background: COLORS.primary, display: "flex", alignItems: "center", justifyContent: "center",
                    border: "2px solid #fff", boxShadow: COLORS.shadowSm,
                  }}>
                    <Camera size={10} color="#fff" />
                  </span>
                  <input type="file" accept="image/*" disabled={busy} onChange={e => changePhoto(p, e.target.files?.[0])} style={{ display: "none" }} />
                </label>

                <div style={{ flex: 1, minWidth: 0 }}>
                  {isEditingName ? (
                    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                      <input autoFocus value={editingName} onChange={e => setEditingName(e.target.value)}
                        onKeyDown={e => e.key === "Enter" && saveName(p.id)}
                        style={{ ...fieldStyle, padding: "6px 9px", fontSize: 13.5, flex: 1 }} />
                      <button onClick={() => saveName(p.id)} className="sd-btn" style={{ background: COLORS.sage, border: "none", borderRadius: 8, width: 28, height: 28, cursor: "pointer", color: "#fff", flexShrink: 0 }}>
                        <Check size={13} style={{ display: "block", margin: "0 auto" }} />
                      </button>
                    </div>
                  ) : (
                    <div style={{ fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                      {p.nome}
                      <Pill fg={p.ativo !== false ? COLORS.sage : COLORS.inkFaint} bg={p.ativo !== false ? COLORS.sageSoft : COLORS.bgAlt} dot>
                        {p.ativo !== false ? "Ativa" : "Inativa"}
                      </Pill>
                    </div>
                  )}
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{total} atendimento{total !== 1 ? "s" : ""}</div>
                </div>

                {!isEditingName && (
                  <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                    <button disabled={busy} onClick={() => startEditName(p)} className="sd-btn" style={{ background: COLORS.primarySoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.primary }}>
                      <Pencil size={13.5} style={{ display: "block", margin: "0 auto" }} />
                    </button>
                    <button disabled={busy} onClick={() => toggleAtivo(p)} className="font-body sd-btn" style={{
                      background: "transparent", border: `1px solid ${COLORS.border}`, color: COLORS.inkSoft,
                      borderRadius: 9, padding: "0 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", height: 32,
                    }}>
                      {p.ativo !== false ? "Desativar" : "Ativar"}
                    </button>
                    <button disabled={busy} onClick={() => remove(p)} className="sd-btn" style={{ background: COLORS.terraSoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.terra }}>
                      <Trash2 size={13.5} style={{ display: "block", margin: "0 auto" }} />
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </Card>
      )}

      {showAdd ? (
        <Card style={{ padding: 12 }}>
          <form onSubmit={addProfessional} style={{ display: "flex", gap: 8 }}>
            <input autoFocus placeholder="Nome da profissional" value={addingName} onChange={e => setAddingName(e.target.value)} style={{ ...fieldStyle, flex: 1 }} />
            <PrimaryButton type="submit" loading={adding} style={{ padding: "0 16px" }}>Adicionar</PrimaryButton>
            <GhostButton type="button" onClick={() => { setShowAdd(false); setAddingName(""); }}>Cancelar</GhostButton>
          </form>
        </Card>
      ) : (
        <button onClick={() => setShowAdd(true)} className="font-body sd-btn" style={{
          width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 7,
          border: `1.5px dashed ${COLORS.border}`, borderRadius: 14, padding: "13px", background: "transparent",
          color: COLORS.primary, fontSize: 13, fontWeight: 700, cursor: "pointer",
        }}>
          <Plus size={15} /> Adicionar profissional
        </button>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: HORÁRIOS (funcionamento + folgas/férias/bloqueios)
--------------------------------------------------------- */
function addDaysToDateStr(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function buildDaysState(rows, professionalId) {
  const forThis = rows.filter(r => (r.professionalId || null) === (professionalId || null));
  return Array.from({ length: 7 }, (_, weekday) => {
    const row = forThis.find(r => r.weekday === weekday);
    return row
      ? { weekday, open: true, start: row.start, end: row.end, hasBreak: !!row.breakStart, breakStart: row.breakStart || "12:00", breakEnd: row.breakEnd || "13:00" }
      : { weekday, open: false, start: "09:00", end: "19:00", hasBreak: false, breakStart: "12:00", breakEnd: "13:00" };
  });
}

function Horarios({ data, onSaveWorkingHours, onAddTimeOff, onRemoveTimeOff }) {
  const { professionals, workingHours, timeOff } = data;
  const [selectedProf, setSelectedProf] = useState(""); // "" = padrão do estabelecimento
  const [days, setDays] = useState(() => buildDaysState(workingHours, null));
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    setDays(buildDaysState(workingHours, selectedProf || null));
  }, [selectedProf, workingHours]);

  function updateDay(weekday, patch) {
    setDays(ds => ds.map(d => d.weekday === weekday ? { ...d, ...patch } : d));
  }

  async function saveHours() {
    setSaving(true); setError(""); setSaved(false);
    try {
      await onSaveWorkingHours(selectedProf || null, days);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  // --- Folgas / férias / bloqueios ---
  const [toProf, setToProf] = useState(professionals[0]?.id || "");
  const [tipo, setTipo] = useState("folga");
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [startTime, setStartTime] = useState("08:00");
  const [endTime, setEndTime] = useState("18:00");
  const [motivo, setMotivo] = useState("");
  const [savingTo, setSavingTo] = useState(false);
  const [toError, setToError] = useState("");
  const [busyToId, setBusyToId] = useState(null);

  async function submitTimeOff(e) {
    e.preventDefault();
    if (!toProf || !startDate || !endDate) return;
    setSavingTo(true); setToError("");
    try {
      const payload = (tipo === "bloqueio" || tipo === "compromisso")
        ? {
            professional_id: toProf, tipo,
            start_at: new Date(`${startDate}T${startTime}:00`).toISOString(),
            end_at: new Date(`${endDate}T${endTime}:00`).toISOString(),
            motivo: motivo || null,
          }
        : {
            professional_id: toProf, tipo,
            start_at: new Date(`${startDate}T00:00:00`).toISOString(),
            end_at: new Date(`${addDaysToDateStr(endDate, 1)}T00:00:00`).toISOString(),
            motivo: motivo || null,
          };
      await onAddTimeOff(payload);
      setStartDate(""); setEndDate(""); setMotivo("");
    } catch (err) { setToError(err.message); }
    finally { setSavingTo(false); }
  }

  async function removeTo(id) {
    setBusyToId(id); setToError("");
    try { await onRemoveTimeOff(id); } catch (err) { setToError(err.message); }
    finally { setBusyToId(null); }
  }

  const tipoLabel = { folga: "Folga", ferias: "Férias", bloqueio: "Bloqueio", compromisso: "Compromisso" };
  const tipoTone = { folga: [COLORS.amber, COLORS.amberSoft], ferias: [COLORS.gold, COLORS.goldSoft], bloqueio: [COLORS.terra, COLORS.terraSoft], compromisso: [COLORS.terra, COLORS.terraSoft] };

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Horários</h1>

      <SectionLabel>Horário de funcionamento</SectionLabel>
      <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 12, lineHeight: 1.5 }}>
        Configure o padrão do estabelecimento ou personalize o horário de uma profissional específica. Dias sem horário ficam fechados na agenda pública.
      </div>

      <select value={selectedProf} onChange={e => setSelectedProf(e.target.value)} style={{ ...fieldStyle, marginBottom: 14 }}>
        <option value="">Padrão do estabelecimento</option>
        {professionals.map(p => <option key={p.id} value={p.id}>{p.nome} (personalizado)</option>)}
      </select>

      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 4, overflow: "hidden", marginBottom: 14 }}>
        {days.map((d, i) => (
          <div key={d.weekday} style={{ padding: "12px", borderBottom: i < 6 ? `1px solid ${COLORS.border}` : "none" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: d.open ? 10 : 0 }}>
              <span style={{ fontWeight: 700, fontSize: 13.5 }}>{WEEKDAY_FULL[d.weekday]}</span>
              <button onClick={() => updateDay(d.weekday, { open: !d.open })} className="sd-check" style={{
                width: 40, height: 22, borderRadius: 999, border: "none", cursor: "pointer", position: "relative",
                background: d.open ? COLORS.sage : COLORS.border,
              }}>
                <span style={{
                  position: "absolute", top: 2, left: d.open ? 20 : 2, width: 18, height: 18, borderRadius: "50%",
                  background: "#fff", transition: "left 0.18s ease",
                }} />
              </button>
            </div>
            {d.open && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <input type="time" value={d.start} onChange={e => updateDay(d.weekday, { start: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
                  <span style={{ color: COLORS.inkFaint, fontSize: 12 }}>até</span>
                  <input type="time" value={d.end} onChange={e => updateDay(d.weekday, { end: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
                </div>
                <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: COLORS.inkSoft, cursor: "pointer" }}>
                  <input type="checkbox" checked={d.hasBreak} onChange={e => updateDay(d.weekday, { hasBreak: e.target.checked })} />
                  Intervalo de almoço
                </label>
                {d.hasBreak && (
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <input type="time" value={d.breakStart} onChange={e => updateDay(d.weekday, { breakStart: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
                    <span style={{ color: COLORS.inkFaint, fontSize: 12 }}>até</span>
                    <input type="time" value={d.breakEnd} onChange={e => updateDay(d.weekday, { breakEnd: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
                  </div>
                )}
              </div>
            )}
          </div>
        ))}
      </Card>
      <PrimaryButton onClick={saveHours} loading={saving} style={{ width: "100%", marginBottom: 28 }}>
        {saved ? <><Check size={15} /> Salvo</> : "Salvar horários"}
      </PrimaryButton>

      <SectionLabel>Folgas, férias e bloqueios</SectionLabel>
      {professionals.length === 0 ? (
        <Card style={{ padding: 16, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Cadastre uma profissional em Equipe primeiro.</Card>
      ) : (
        <>
          <Card style={{ padding: 16, marginBottom: 16 }}>
            <ErrorBanner message={toError} onDismiss={() => setToError("")} />
            <form onSubmit={submitTimeOff} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <select value={toProf} onChange={e => setToProf(e.target.value)} style={fieldStyle}>
                {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
              </select>
              <select value={tipo} onChange={e => setTipo(e.target.value)} style={fieldStyle}>
                <option value="folga">Folga</option>
                <option value="ferias">Férias</option>
                <option value="bloqueio">Bloqueio manual (horário específico)</option>
                <option value="compromisso">Compromisso pessoal (horário específico)</option>
              </select>
              <div style={{ display: "flex", gap: 8 }}>
                <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={fieldStyle} />
                <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} style={fieldStyle} />
              </div>
              {(tipo === "bloqueio" || tipo === "compromisso") && (
                <div style={{ display: "flex", gap: 8 }}>
                  <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} style={fieldStyle} />
                  <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} style={fieldStyle} />
                </div>
              )}
              <input placeholder="Motivo (opcional)" value={motivo} onChange={e => setMotivo(e.target.value)} style={fieldStyle} />
              <PrimaryButton type="submit" loading={savingTo}><Plus size={15} /> Adicionar</PrimaryButton>
            </form>
          </Card>

          {timeOff.length === 0 ? (
            <Card style={{ padding: 16, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhuma folga, férias ou bloqueio cadastrado.</Card>
          ) : (
            <Card style={{ padding: 4, overflow: "hidden" }}>
              {timeOff.map((t, i) => {
                const prof = professionals.find(p => p.id === t.professionalId);
                const [fg, bg] = tipoTone[t.tipo] || [COLORS.inkSoft, COLORS.bgAlt];
                return (
                  <div key={t.id} className="sd-row" style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px",
                    borderBottom: i < timeOff.length - 1 ? `1px solid ${COLORS.border}` : "none", opacity: busyToId === t.id ? 0.6 : 1,
                  }}>
                    <div>
                      <div style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 700, fontSize: 13 }}>
                        <Pill fg={fg} bg={bg}>{tipoLabel[t.tipo]}</Pill> {prof?.nome}
                      </div>
                      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 4 }}>
                        {new Date(t.startAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined, minute: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined })}
                        {" → "}
                        {new Date(t.endAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined, minute: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined })}
                      </div>
                      {t.motivo && <div style={{ fontSize: 11.5, color: COLORS.inkFaint, marginTop: 2 }}>{t.motivo}</div>}
                    </div>
                    <button disabled={busyToId === t.id} onClick={() => removeTo(t.id)} className="sd-btn" style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkFaint, padding: 4 }}>
                      <Trash2 size={15} />
                    </button>
                  </div>
                );
              })}
            </Card>
          )}
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: SERVIÇOS
--------------------------------------------------------- */
function Servicos({ data, onAdd, onUpdate, onRemove }) {
  const { services } = data;
  const [form, setForm] = useState({ nome: "", categoria: "", duracao: "60", preco: "" });
  const [novaCategoria, setNovaCategoria] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");

  const existingCategories = useMemo(() => {
    const set = new Set(services.map(s => (s.categoria || "").trim()).filter(Boolean));
    return Array.from(set).sort((a, b) => a.localeCompare(b, "pt-BR"));
  }, [services]);

  function handleCategoriaSelect(value) {
    if (value === "__nova__") { setNovaCategoria(true); setForm(f => ({ ...f, categoria: "" })); }
    else { setNovaCategoria(false); setForm(f => ({ ...f, categoria: value })); }
  }

  async function submit(e) {
    e.preventDefault();
    if (!form.nome.trim()) return;
    setSaving(true); setError("");
    try {
      const payload = {
        nome: form.nome, categoria: form.categoria.trim() || "Geral",
        duracao_min: Number(form.duracao) || 60, preco: Number(form.preco) || 0,
      };
      if (editingId) await onUpdate(editingId, payload);
      else await onAdd(payload);
      setForm({ nome: "", categoria: "", duracao: "60", preco: "" });
      setNovaCategoria(false);
      setEditingId(null);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function edit(sv) {
    setEditingId(sv.id);
    setForm({ nome: sv.nome, categoria: sv.categoria || "", duracao: String(sv.duracao || 60), preco: String(sv.preco) });
    setNovaCategoria(sv.categoria ? !existingCategories.includes(sv.categoria) : false);
  }

  async function remove(id) {
    setBusyId(id); setError("");
    try {
      await onRemove(id);
      if (editingId === id) { setEditingId(null); setForm({ nome: "", categoria: "", duracao: "60", preco: "" }); setNovaCategoria(false); }
    } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  // Agrupa por categoria na mesma ordem em que as categorias foram criadas
  const grouped = useMemo(() => {
    const order = [];
    const map = {};
    services.forEach(sv => {
      const cat = sv.categoria || "Geral";
      if (!map[cat]) { map[cat] = []; order.push(cat); }
      map[cat].push(sv);
    });
    return order.map(cat => ({ cat, items: map[cat] }));
  }, [services]);

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Serviços</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>{editingId ? "Editar serviço" : "Novo serviço"}</SectionLabel>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 10, lineHeight: 1.5 }}>
          Agrupe os serviços por categoria (ex.: Cabelo, Unha, Sobrancelha) — assim fica mais fácil pra você organizar e pra cliente encontrar o que procura na hora de agendar.
        </div>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do serviço" value={form.nome} onChange={e => setForm(f => ({ ...f, nome: e.target.value }))} style={fieldStyle} />

          {existingCategories.length === 0 || novaCategoria ? (
            <div style={{ display: "flex", gap: 8 }}>
              <input placeholder="Nome da categoria (ex.: Cabelo, Unha)" value={form.categoria}
                onChange={e => setForm(f => ({ ...f, categoria: e.target.value }))} style={{ ...fieldStyle, flex: 1 }} />
              {existingCategories.length > 0 && (
                <button type="button" onClick={() => { setNovaCategoria(false); setForm(f => ({ ...f, categoria: existingCategories[0] })); }}
                  className="font-body sd-btn" style={{ background: COLORS.bgAlt, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "0 14px", fontSize: 12.5, fontWeight: 700, color: COLORS.inkSoft, cursor: "pointer" }}>
                  Cancelar
                </button>
              )}
            </div>
          ) : (
            <select value={form.categoria || existingCategories[0]} onChange={e => handleCategoriaSelect(e.target.value)} style={fieldStyle}>
              {existingCategories.map(c => <option key={c} value={c}>{c}</option>)}
              <option value="__nova__">+ Nova categoria...</option>
            </select>
          )}

          <div style={{ display: "flex", gap: 10 }}>
            <select value={form.duracao} onChange={e => setForm(f => ({ ...f, duracao: e.target.value }))} style={fieldStyle}>
              {DURATION_OPTIONS.map(m => <option key={m} value={m}>{formatDuration(m)}</option>)}
            </select>
            <input placeholder="Preço (R$)" type="number" value={form.preco} onChange={e => setForm(f => ({ ...f, preco: e.target.value }))} style={fieldStyle} />
          </div>
          <PrimaryButton type="submit" loading={saving} style={{ marginTop: 2 }}>
            <Plus size={15} /> {editingId ? "Salvar alterações" : "Adicionar serviço"}
          </PrimaryButton>
          {editingId && (
            <button type="button" onClick={() => { setEditingId(null); setForm({ nome: "", categoria: "", duracao: "60", preco: "" }); setNovaCategoria(false); }}
              className="font-body" style={{ background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12, cursor: "pointer" }}>
              Cancelar edição
            </button>
          )}
        </form>
      </Card>

      {services.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhum serviço cadastrado ainda.</Card>
      ) : (
        grouped.map(({ cat, items }) => (

                    <button disabled={busyId === sv.id} onClick={() => remove(sv.id)} className="sd-btn" style={{ background: COLORS.terraSoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.terra }}>
                      <Trash2 size={13.5} style={{ display: "block", margin: "0 auto" }} />

          </div>
        ))
      )}

  );
}

function Compras({ data, onAdd, onToggle, onRemove }) {
  const { shoppingList } = data;
  const [novo, setNovo] = useState("");
  const [categoria, setCategoria] = useState(CATEGORIES[0]);
  const [saving, setSaving] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");
  const [purchaseFor, setPurchaseFor] = useState(null);
  const [purchaseValue, setPurchaseValue] = useState("");
  const [purchasePayment, setPurchasePayment] = useState("Pix");
  const [purchaseDate, setPurchaseDate] = useState(todayIso());

  async function add(e) {
    e.preventDefault();
    if (!novo.trim()) return;
    setSaving(true); setError("");
    try {
      await onAdd({ nome: novo, categoria, comprado: false });
      setNovo("");
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }
  async function toggle(item) {
    if (!item.comprado) {
      setPurchaseFor(item); setPurchaseValue(""); setPurchasePayment("Pix"); setPurchaseDate(todayIso());
      return;
    }
    setBusyId(item.id); setError("");
    try { await onToggle(item.id, { comprado: false, valor_gasto: null, forma_pagamento: null, comprado_em: null }); }
    catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }
  async function confirmPurchase(e) {
    e.preventDefault();
    if (!purchaseFor || !(Number(purchaseValue) >= 0)) return;
    setBusyId(purchaseFor.id); setError("");
    try {
      await onToggle(purchaseFor.id, {
        comprado: true, valor_gasto: Number(purchaseValue), forma_pagamento: purchasePayment, comprado_em: purchaseDate,
      });
      setPurchaseFor(null);
    } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }
  async function remove(id) {
    setBusyId(id);
    try { await onRemove(id); } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  function shareOnWhatsApp() {
    const pending = shoppingList.filter(item => !item.comprado);
    if (pending.length === 0) { setError("Não há itens pendentes para enviar."); return; }
    const lines = ["🛒 *Lista de compras*", ""];
    CATEGORIES.forEach(cat => {
      const items = pending.filter(item => item.categoria === cat);
      if (items.length > 0) {
        lines.push(`*${cat}*`);
        items.forEach(item => lines.push(`☐ ${item.nome}`));
        lines.push("");
      }
    });
    window.open(`https://wa.me/?text=${encodeURIComponent(lines.join("\n").trim())}`, "_blank", "noopener,noreferrer");
  }

  return (
    <div className="fade-up">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, margin: "2px 0 16px" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Lista de compras</h1>
        <button onClick={shareOnWhatsApp} className="font-body sd-btn" style={{
          background: "#1E9E56", color: "#fff", border: "none", borderRadius: 999,
          padding: "9px 13px", fontSize: 11.5, fontWeight: 700, cursor: "pointer",
          display: "flex", alignItems: "center", gap: 6, flexShrink: 0,
        }}><MessageCircle size={14} /> WhatsApp</button>
      </div>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 20 }}>
        <SectionLabel>Novo item</SectionLabel>
        <form onSubmit={add} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do item" value={novo} onChange={e => setNovo(e.target.value)} style={fieldStyle} />
          <select value={categoria} onChange={e => setCategoria(e.target.value)} style={fieldStyle}>
            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <PrimaryButton type="submit" loading={saving} style={{ marginTop: 2 }}><Plus size={15} /> Adicionar item</PrimaryButton>
        </form>
      </Card>

      {shoppingList.length === 0 && (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Lista vazia por enquanto.</Card>
      )}

      {CATEGORIES.map(cat => {
        const items = shoppingList.filter(i => i.categoria === cat);
        if (items.length === 0) return null;
        return (
          <div key={cat} style={{ marginBottom: 18 }}>
            <SectionLabel>{cat}</SectionLabel>
            <Card style={{ padding: 4, overflow: "hidden" }}>
              {items.map((item, i) => (
                <div key={item.id} className="sd-row" style={{
                  display: "flex", alignItems: "center", gap: 11, padding: "11px 12px",
                  borderBottom: i < items.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
                  opacity: busyId === item.id ? 0.6 : 1,
                }}>
                  <button onClick={() => toggle(item)} className="sd-check" style={{
                    width: 21, height: 21, borderRadius: 7, border: `1.5px solid ${item.comprado ? COLORS.sage : COLORS.borderStrong}`,
                    background: item.comprado ? COLORS.sage : "transparent", cursor: "pointer", flexShrink: 0,
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}>
                    {item.comprado && <Check size={13} color="#fff" />}
                  </button>
                  <span style={{
                    flex: 1, fontSize: 13.5,
                    textDecoration: item.comprado ? "line-through" : "none",
                    color: item.comprado ? COLORS.inkFaint : COLORS.ink,
                    transition: "color 0.15s ease",
                  }}>{item.nome}</span>
                  {item.comprado && item.valorGasto != null && (
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 800, color: COLORS.terra }}>{fmtBRL(item.valorGasto)}</div>
                      <div style={{ fontSize: 10.5, color: COLORS.inkFaint }}>{item.formaPagamento}</div>
                    </div>
                  )}
                  <button onClick={() => remove(item.id)} className="sd-btn" style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkFaint, padding: 4 }}>
                    <Trash2 size={15} />
                  </button>
                </div>
              ))}
            </Card>
          </div>
        );
      })}
      {purchaseFor && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,.5)", zIndex: 120, display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }} onClick={() => setPurchaseFor(null)}>
          <Card className="pop-in" style={{ padding: 22, width: "100%", maxWidth: 380 }} onClick={e => e.stopPropagation()}>
            <h2 className="font-display" style={{ fontSize: 19, margin: "0 0 5px" }}>Registrar compra</h2>
            <p style={{ fontSize: 12.5, color: COLORS.inkSoft, margin: "0 0 15px" }}>{purchaseFor.nome}</p>
            <form onSubmit={confirmPurchase} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <input autoFocus required type="number" min="0" step="0.01" placeholder="Quanto você gastou? (R$)" value={purchaseValue} onChange={e => setPurchaseValue(e.target.value)} style={fieldStyle} />
              <select value={purchasePayment} onChange={e => setPurchasePayment(e.target.value)} style={fieldStyle}>
                {PAYMENT_METHODS.map(p => <option key={p}>{p}</option>)}
              </select>
              <input required type="date" value={purchaseDate} onChange={e => setPurchaseDate(e.target.value)} style={fieldStyle} />
              <PrimaryButton type="submit" loading={busyId === purchaseFor.id}><Check size={15} /> Confirmar compra</PrimaryButton>
              <GhostButton type="button" onClick={() => setPurchaseFor(null)} style={{ justifyContent: "center" }}>Cancelar</GhostButton>
            </form>
          </Card>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: FINANCEIRO
--------------------------------------------------------- */
function earningsInRange(appointments, services, start, end) {
  const priceMap = Object.fromEntries(services.map(s => [s.id, s.preco]));
  return appointments
    .filter(a => a.status !== "cancelado")
    .filter(a => { const d = new Date(a.data + "T00:00:00"); return d >= start && d < end; })
    .reduce((sum, a) => sum + (priceMap[a.servicoId] || 0), 0);
}

function Financeiro({ data, establishment, onAdd, onUpdate, onRemove, onAddGoal, onUpdateGoal, onRemoveGoal, onToggleLesson, onSaveAnswer, onIssueCertificate }) {
  const { appointments, services, clients, transactions = [], goals = [] } = data;
  const [mode, setMode] = useState("month");
  const [section, setSection] = useState("visao");
  const [referenceDate, setReferenceDate] = useState(todayIso());
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [form, setForm] = useState({ tipo: "saida", descricao: "", categoria: "Outros", valor: "", forma_pagamento: "Pix", data: todayIso(), pago: true, recorrente: false, periodicidade: "mensal", vencimento: "", appointment_id: "" });
  const [showGoalForm, setShowGoalForm] = useState(false);
  const [goalForm, setGoalForm] = useState({ nome: "", emoji: "✨", valor_meta: "" });
  const [savingGoal, setSavingGoal] = useState(false);
  const [contributingId, setContributingId] = useState(null);
  const [contributeValue, setContributeValue] = useState("");
  const GOAL_EMOJIS = ["✨", "🎯", "✈️", "🏠", "💅", "🚗", "🎓", "💍"];
  const [openModuleId, setOpenModuleId] = useState(null);
  const [openLessonId, setOpenLessonId] = useState(null);
  const [answerDraft, setAnswerDraft] = useState("");
  const [savingAnswer, setSavingAnswer] = useState(false);
  function openLesson(lessonId) {
    setOpenLessonId(lessonId);
    setAnswerDraft((establishment?.courseAnswers || {})[lessonId] || "");
  }
  const [showCertificate, setShowCertificate] = useState(false);
  const [issuingCert, setIssuingCert] = useState(false);
  const courseProgress = establishment?.courseProgress || [];
  const courseDone = courseProgress.length >= COURSE_TOTAL_LESSONS;
  const now = new Date(referenceDate + "T12:00:00");

  const period = useMemo(() => {
    let start, end, label;
    if (mode === "day") { start = new Date(now.getFullYear(), now.getMonth(), now.getDate()); end = new Date(start); end.setDate(end.getDate() + 1); label = "Hoje"; }
    else if (mode === "week") { start = new Date(now); start.setHours(0,0,0,0); start.setDate(start.getDate() - start.getDay()); end = new Date(start); end.setDate(end.getDate() + 7); label = "Semana atual"; }
    else if (mode === "year") { start = new Date(now.getFullYear(),0,1); end = new Date(now.getFullYear()+1,0,1); label = `Ano ${now.getFullYear()}`; }
    else { start = new Date(now.getFullYear(),now.getMonth(),1); end = new Date(now.getFullYear(),now.getMonth()+1,1); label = `${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}`; }
    return { start, end, label };
  }, [mode, referenceDate]);

  const periodTx = useMemo(() => transactions.filter(t => { const d = new Date(t.data + "T12:00:00"); return d >= period.start && d < period.end; }), [transactions, period]);
  const entradas = periodTx.filter(t => t.tipo === "entrada" && t.pago).reduce((s,t) => s + t.valor, 0);
  const saidas = periodTx.filter(t => t.tipo === "saida" && t.pago).reduce((s,t) => s + t.valor, 0);
  const previsto = earningsInRange(appointments, services, period.start, period.end);
  const saldo = entradas - saidas;
  const pendingBills = transactions.filter(t => t.tipo === "saida" && !t.pago).sort((a,b) => (a.vencimento || a.data).localeCompare(b.vencimento || b.data));

  function pickAppointment(id) {
    const a = appointments.find(x => x.id === id);
    const service = services.find(s => s.id === a?.servicoId);
    const client = clients.find(c => c.id === a?.clienteId);
    setForm(f => ({ ...f, appointment_id: id, tipo: "entrada", descricao: a ? `Atendimento: ${client?.nome || "Cliente"} · ${service?.nome || "Serviço"}` : f.descricao, valor: a ? String(service?.preco || 0) : f.valor, categoria: "Serviços", data: a?.data || f.data }));
  }

  function openNewTransaction(tipo = "saida", recorrente = false, categoria) {
    setForm({ tipo, descricao: "", categoria: categoria || (tipo === "entrada" ? "Serviços" : "Outros"), valor: "", forma_pagamento: "Pix", data: todayIso(), pago: !recorrente, recorrente, periodicidade: "mensal", vencimento: recorrente ? todayIso() : "", appointment_id: "" });
    setShowForm(true);
    setSection("lancamentos");
  }

  async function submit(e) {
    e.preventDefault(); if (!form.descricao.trim() || !(Number(form.valor) >= 0)) return;
    setSaving(true); setError("");
    try {
      await onAdd({
        tipo: form.tipo, descricao: form.descricao.trim(), categoria: form.categoria, valor: Number(form.valor),
        forma_pagamento: form.forma_pagamento || null, data: form.data, pago: form.pago,
        recorrente: form.recorrente, periodicidade: form.recorrente ? form.periodicidade : null,
        vencimento: form.vencimento || null, appointment_id: form.appointment_id || null,
      });
      setForm({ tipo: "saida", descricao: "", categoria: "Outros", valor: "", forma_pagamento: "Pix", data: todayIso(), pago: true, recorrente: false, periodicidade: "mensal", vencimento: "", appointment_id: "" });
      setShowForm(false); setSection("visao");
    } catch (err) { setError(err.message); } finally { setSaving(false); }
  }

  async function togglePaid(t) {
    try {
      const becomingPaid = !t.pago;
      await onUpdate(t.id, { pago: becomingPaid });
      // Ao pagar uma conta recorrente, prepara automaticamente a próxima.
      if (becomingPaid && t.recorrente) {
        const base = new Date((t.vencimento || t.data) + "T12:00:00");
        if (t.periodicidade === "semanal") base.setDate(base.getDate() + 7);
        else if (t.periodicidade === "anual") base.setFullYear(base.getFullYear() + 1);
        else base.setMonth(base.getMonth() + 1);
        const nextDate = base.toISOString().slice(0,10);
        await onAdd({ tipo:t.tipo, descricao:t.descricao, categoria:t.categoria, valor:t.valor, forma_pagamento:t.formaPagamento || null, data:nextDate, pago:false, recorrente:true, periodicidade:t.periodicidade || "mensal", vencimento:nextDate });
      }
    } catch (err) { setError(err.message); }
  }
  async function remove(t) { if (!window.confirm(`Excluir o lançamento “${t.descricao}”?`)) return; try { await onRemove(t.id); } catch (err) { setError(err.message); } }

  async function submitGoal(e) {
    e.preventDefault();
    if (!goalForm.nome.trim() || !(Number(goalForm.valor_meta) > 0)) return;
    setSavingGoal(true); setError("");
    try {
      await onAddGoal({ nome: goalForm.nome.trim(), emoji: goalForm.emoji, valor_meta: Number(goalForm.valor_meta) });
      setGoalForm({ nome: "", emoji: "✨", valor_meta: "" });
      setShowGoalForm(false);
    } catch (err) { setError(err.message); } finally { setSavingGoal(false); }
  }

  async function submitContribution(goal) {
    const amount = Number(contributeValue);
    if (!(amount > 0)) return;
    try {
      const novoValor = goal.valorAtual + amount;
      await onUpdateGoal(goal.id, { valor_atual: novoValor, concluido: novoValor >= goal.valorMeta });
      setContributingId(null); setContributeValue("");
    } catch (err) { setError(err.message); }
  }

  async function removeGoal(goal) {
    if (!window.confirm(`Remover o sonho “${goal.nome}”?`)) return;
    try { await onRemoveGoal(goal.id); } catch (err) { setError(err.message); }
  }

  function downloadCsv() {
    const lines = ["Data;Tipo;Descrição;Categoria;Forma;Valor;Pago", ...periodTx.map(t => `${t.data};${t.tipo};${t.descricao};${t.categoria};${t.formaPagamento};${t.valor.toFixed(2).replace(".",",")};${t.pago ? "Sim" : "Não"}`)];
    const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = `financeiro-${mode}.csv`; a.click(); URL.revokeObjectURL(url);
  }

  const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const monthEnd = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 1);
  const monthEntradas = transactions.filter(t => t.tipo === "entrada" && t.pago && new Date(t.data + "T12:00:00") >= monthStart && new Date(t.data + "T12:00:00") < monthEnd).reduce((s, t) => s + t.valor, 0);
  const monthSaidas = transactions.filter(t => t.tipo === "saida" && t.pago && new Date(t.data + "T12:00:00") >= monthStart && new Date(t.data + "T12:00:00") < monthEnd).reduce((s, t) => s + t.valor, 0);
  const monthSobra = monthEntradas - monthSaidas;
  const reservaSugerida = monthSobra > 0 ? monthSobra * 0.1 : 0;

  const card = (label, value, color, sub) => <Card style={{ padding: 16, minWidth: 0 }}><div style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 750 }}>{label}</div><div className="font-display" style={{ fontSize: 23, color, fontWeight: 650, marginTop: 6 }}>{fmtBRL(value)}</div><div style={{ fontSize: 10.5, color: COLORS.inkFaint, marginTop: 3 }}>{sub}</div></Card>;

  return (
    <div className="fade-up">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Financeiro</h1>
        <PrimaryButton onClick={() => openNewTransaction("saida")}><Plus size={15} /> Novo lançamento</PrimaryButton>
      </div>
      <ErrorBanner message={error} onDismiss={() => setError("")} />
      <div className="scrollbar-thin" style={{ display: "flex", gap: 6, marginBottom: 11, background: COLORS.bgAlt, padding: 4, borderRadius: 13, overflowX: "auto" }}>
        {[{k:"day",l:"Hoje"},{k:"week",l:"Semana"},{k:"month",l:"Mês"},{k:"year",l:"Ano"}].map(f => <button key={f.k} onClick={() => setMode(f.k)} className="font-body sd-tab" style={{ flex: 1, minWidth: 72, border: "none", background: mode === f.k ? COLORS.surface : "transparent", color: mode === f.k ? COLORS.primary : COLORS.inkSoft, boxShadow: mode === f.k ? COLORS.shadowSm : "none", borderRadius: 10, padding: 9, fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>{f.l}</button>)}
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 15, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 700 }}>Período analisado</span>
        {mode === "month" ? <input type="month" value={referenceDate.slice(0,7)} onChange={e => setReferenceDate(`${e.target.value || todayIso().slice(0,7)}-01`)} style={{ ...fieldStyle, width: 150, padding: "8px 10px", fontSize: 12.5 }} />
          : mode === "year" ? <input type="number" min="2020" max="2100" value={referenceDate.slice(0,4)} onChange={e => setReferenceDate(`${e.target.value || new Date().getFullYear()}-01-01`)} style={{ ...fieldStyle, width: 100, padding: "8px 10px", fontSize: 12.5 }} />
          : <input type="date" value={referenceDate} onChange={e => setReferenceDate(e.target.value || todayIso())} style={{ ...fieldStyle, width: 150, padding: "8px 10px", fontSize: 12.5 }} />}
      </div>

      <div className="scrollbar-thin" style={{ display: "flex", gap: 5, marginBottom: 16, overflowX: "auto" }}>
        {[{k:"visao",l:"Visão geral"},{k:"lancamentos",l:"Lançamentos"},{k:"contas",l:"Contas"},{k:"aprenda",l:"Aprenda"}].map(t => <button key={t.k} onClick={() => { setSection(t.k); setShowForm(false); }} className="font-body sd-btn" style={{ flexShrink: 0, border: `1px solid ${section===t.k ? COLORS.primary : COLORS.border}`, background: section===t.k ? COLORS.primarySoft : COLORS.surface, color: section===t.k ? COLORS.primary : COLORS.inkSoft, borderRadius: 999, padding: "7px 10px", fontSize: 11.5, fontWeight: 750, cursor: "pointer", whiteSpace: "nowrap" }}>{t.l}</button>)}
      </div>

      {section === "visao" && <>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, fontWeight: 700, margin: "1px 0 8px" }}>Resumo do período: {period.label}</div>
        <Card style={{ padding: "18px", marginBottom: 12, background: `linear-gradient(155deg, ${COLORS.primary}, ${COLORS.primaryDeep})`, border: "none" }}>
          <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.75)", fontWeight: 700 }}>Saldo em caixa · {period.label}</div>
          <div className="font-display" style={{ fontSize: 32, color: "#fff", fontWeight: 600, marginTop: 3 }}>{fmtBRL(saldo)}</div>
          <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.75)", marginTop: 6 }}>Entradas recebidas menos despesas pagas.</div>
        </Card>
        <Card style={{ padding: "16px 18px", marginBottom: 12, background: `linear-gradient(155deg, ${COLORS.gold}, #7A5D2C)`, border: "none" }}>
          <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.85)", fontWeight: 700 }}>O que sobrou esse mês</div>
          <div className="font-display" style={{ fontSize: 26, color: "#fff", fontWeight: 600, marginTop: 3 }}>{fmtBRL(monthSobra)}</div>
          <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.92)", marginTop: 7, lineHeight: 1.5 }}>
            {monthSobra > 0
              ? <>Uma prática saudável é guardar uma parte pra imprevistos — sugestão de <strong>10%: {fmtBRL(reservaSugerida)}</strong>. Dá pra separar isso ali embaixo, em "Seus sonhos".</>
              : "Esse mês as saídas passaram as entradas. Dá uma olhada na aba \"Aprenda\" pra algumas ideias práticas."}
          </div>
        </Card>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(145px,1fr))", gap: 9, marginBottom: 15 }}>
          {card("Entradas", entradas, COLORS.sage, `recebidas em ${period.label}`)}
          {card("Saídas", saidas, COLORS.terra, `pagas em ${period.label}`)}
          {card("Ganhos estimados", previsto, COLORS.primary, `agenda de ${period.label}`)}
          {card("A pagar", pendingBills.reduce((s,t)=>s+t.valor,0), COLORS.gold, `${pendingBills.length} conta${pendingBills.length!==1?"s":""} pendente${pendingBills.length!==1?"s":""}`)}
        </div>
        <Card style={{ padding: 16, marginBottom: 15 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: goals.length ? 12 : 6 }}>
            <SectionLabel>Seus sonhos</SectionLabel>
            {goals.length > 0 && <button onClick={() => setShowGoalForm(v => !v)} className="font-body sd-btn" style={{ background: "none", border: "none", color: COLORS.primary, fontSize: 11.5, fontWeight: 800, cursor: "pointer" }}>{showGoalForm ? "Cancelar" : "+ Novo sonho"}</button>}
          </div>

          {goals.length === 0 && !showGoalForm && (
            <button onClick={() => setShowGoalForm(true)} className="font-body sd-btn" style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, border: `1.5px dashed ${COLORS.border}`, borderRadius: 14, padding: 14, background: "transparent", cursor: "pointer", textAlign: "left" }}>
              <span style={{ fontSize: 22 }}>🎯</span>
              <span>
                <div style={{ fontSize: 13, fontWeight: 800, color: COLORS.ink }}>Criar um sonho ou reserva</div>
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 2 }}>Viagem, reforma, reserva de emergência — separe um pouquinho a cada mês.</div>
              </span>
            </button>
          )}

          {showGoalForm && (
            <form onSubmit={submitGoal} style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: goals.length ? 14 : 0 }}>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {GOAL_EMOJIS.map(em => <button type="button" key={em} onClick={() => setGoalForm(f => ({ ...f, emoji: em }))} style={{ width: 32, height: 32, borderRadius: 9, border: `1.5px solid ${goalForm.emoji === em ? COLORS.primary : COLORS.border}`, background: goalForm.emoji === em ? COLORS.primarySoft : COLORS.surface, fontSize: 15, cursor: "pointer" }}>{em}</button>)}
              </div>
              <input placeholder="Nome do sonho (ex.: Reserva de emergência, Viagem)" value={goalForm.nome} onChange={e => setGoalForm(f => ({ ...f, nome: e.target.value }))} style={fieldStyle} />
              <input type="number" min="1" step="0.01" placeholder="Valor objetivo (R$)" value={goalForm.valor_meta} onChange={e => setGoalForm(f => ({ ...f, valor_meta: e.target.value }))} style={fieldStyle} />
              <PrimaryButton type="submit" loading={savingGoal} style={{ marginTop: 2 }}>Criar sonho</PrimaryButton>
            </form>
          )}

          {goals.map(g => {
            const pct = Math.min(100, Math.round((g.valorAtual / g.valorMeta) * 100));
            return (
              <div key={g.id} style={{ padding: "12px 0", borderTop: `1px solid ${COLORS.border}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 7 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 19 }}>{g.emoji}</span>
                    <div>
                      <div style={{ fontSize: 13.5, fontWeight: 800, color: COLORS.ink }}>{g.nome}{g.concluido && " 🎉"}</div>
                      <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{fmtBRL(g.valorAtual)} de {fmtBRL(g.valorMeta)}</div>
                    </div>
                  </div>
                  <button onClick={() => removeGoal(g)} className="sd-btn" style={{ background: "none", border: "none", color: COLORS.inkFaint, cursor: "pointer", padding: 3 }}><Trash2 size={13} /></button>
                </div>
                <div style={{ height: 8, borderRadius: 99, background: COLORS.bgAlt, overflow: "hidden", marginBottom: 8 }}>
                  <div style={{ height: "100%", width: `${pct}%`, borderRadius: 99, background: g.concluido ? COLORS.sage : `linear-gradient(90deg, ${COLORS.gold}, ${COLORS.accent})`, transition: "width .3s ease" }} />
                </div>
                {!g.concluido && (contributingId === g.id ? (
                  <div style={{ display: "flex", gap: 6 }}>
                    <input autoFocus type="number" min="0.01" step="0.01" placeholder="Quanto guardou?" value={contributeValue} onChange={e => setContributeValue(e.target.value)} style={{ ...fieldStyle, padding: "7px 10px", fontSize: 12.5, flex: 1 }} />
                    <button onClick={() => submitContribution(g)} className="sd-btn" style={{ background: COLORS.sage, border: "none", borderRadius: 9, padding: "0 12px", color: "#fff", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>OK</button>
                  </div>
                ) : (
                  <button onClick={() => { setContributingId(g.id); setContributeValue(""); }} className="font-body sd-btn" style={{ background: COLORS.goldSoft, border: "none", borderRadius: 9, padding: "7px 11px", color: COLORS.gold, fontWeight: 800, fontSize: 11.5, cursor: "pointer" }}>+ Guardei dinheiro</button>
                ))}
              </div>
            );
          })}
        </Card>
        <Card style={{ padding: 15, marginBottom: 20 }}>
          <SectionLabel>Controle rápido</SectionLabel>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2,minmax(0,1fr))", gap: 8 }}>
            <button onClick={() => openNewTransaction("entrada")} className="font-body sd-btn" style={{ border: "none", borderRadius: 12, padding: "11px 7px", background: COLORS.sageSoft, color: COLORS.sage, fontSize: 11.5, fontWeight: 800, cursor: "pointer" }}>+ Recebimento</button>
            <button onClick={() => openNewTransaction("saida")} className="font-body sd-btn" style={{ border: "none", borderRadius: 12, padding: "11px 7px", background: COLORS.terraSoft, color: COLORS.terra, fontSize: 11.5, fontWeight: 800, cursor: "pointer" }}>+ Despesa</button>
            <button onClick={() => openNewTransaction("saida", true)} className="font-body sd-btn" style={{ border: "none", borderRadius: 12, padding: "11px 7px", background: COLORS.goldSoft, color: COLORS.gold, fontSize: 11.5, fontWeight: 800, cursor: "pointer" }}>+ Conta fixa</button>
            <button onClick={() => openNewTransaction("saida", false, "Pró-labore / retirada")} className="font-body sd-btn" style={{ border: "none", borderRadius: 12, padding: "11px 7px", background: COLORS.primarySoft, color: COLORS.primary, fontSize: 11.5, fontWeight: 800, cursor: "pointer" }}>+ Pró-labore / retirada</button>
          </div>
        </Card>
        {pendingBills.length > 0 && <Card style={{ padding: 4, marginBottom: 20 }}>
          <div style={{ padding: "10px 12px 6px", fontSize: 12.5, color: COLORS.inkSoft, fontWeight: 800 }}>Próximas contas</div>
          {pendingBills.slice(0,3).map((t,i)=><div key={t.id} className="sd-row" style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderTop:`1px solid ${COLORS.border}`}}><button onClick={()=>togglePaid(t)} className="sd-check" style={{width:20,height:20,borderRadius:7,border:`1.5px solid ${COLORS.gold}`,background:"transparent",cursor:"pointer"}}/><div style={{flex:1,minWidth:0}}><div style={{fontSize:12.5,fontWeight:700}}>{t.descricao}</div><div style={{fontSize:10.5,color:COLORS.inkSoft}}>Vence {fmtDate(t.vencimento||t.data)}</div></div><strong style={{fontSize:12.5,color:COLORS.terra}}>{fmtBRL(t.valor)}</strong></div>)}
          <button onClick={() => setSection("contas")} className="font-body sd-btn" style={{ width:"100%", background:"none", border:"none", color:COLORS.primary, padding:"10px", cursor:"pointer", fontSize:12, fontWeight:800 }}>Ver todas as contas</button>
        </Card>}
      </>}

      {showForm && <Card style={{ padding: 17, marginBottom: 20 }}>
        <SectionLabel>Novo lançamento</SectionLabel>
        <form onSubmit={submit} style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(190px,1fr))", gap: 10 }}>
          <select value={form.tipo} onChange={e => setForm(f=>({...f,tipo:e.target.value}))} style={fieldStyle}><option value="entrada">Entrada / recebimento</option><option value="saida">Saída / despesa</option></select>
          {form.tipo === "entrada" && <select value={form.appointment_id} onChange={e => pickAppointment(e.target.value)} style={fieldStyle}><option value="">Relacionar a um atendimento (opcional)</option>{appointments.filter(a=>a.status!=="cancelado").slice().reverse().map(a=>{const c=clients.find(x=>x.id===a.clienteId);const s=services.find(x=>x.id===a.servicoId);return <option key={a.id} value={a.id}>{fmtDate(a.data)} · {c?.nome} · {s?.nome}</option>})}</select>}
          <input required placeholder="Descrição" value={form.descricao} onChange={e => setForm(f=>({...f,descricao:e.target.value}))} style={fieldStyle} />
          <input required type="number" min="0" step="0.01" placeholder="Valor (R$)" value={form.valor} onChange={e => setForm(f=>({...f,valor:e.target.value}))} style={fieldStyle} />
          <select value={form.categoria} onChange={e => setForm(f=>({...f,categoria:e.target.value}))} style={fieldStyle}>{FINANCE_CATEGORIES.map(c=><option key={c}>{c}</option>)}</select>
          <select value={form.forma_pagamento} onChange={e => setForm(f=>({...f,forma_pagamento:e.target.value}))} style={fieldStyle}>{PAYMENT_METHODS.map(p=><option key={p}>{p}</option>)}</select>
          <input required type="date" value={form.data} onChange={e => setForm(f=>({...f,data:e.target.value}))} style={fieldStyle} />
          <input type="date" value={form.vencimento} onChange={e => setForm(f=>({...f,vencimento:e.target.value}))} style={fieldStyle} title="Vencimento" />
          <label style={{ display:"flex",alignItems:"center",gap:7,fontSize:12.5,color:COLORS.inkSoft }}><input type="checkbox" checked={form.pago} onChange={e=>setForm(f=>({...f,pago:e.target.checked}))}/>{form.tipo==="entrada"?"Já recebi":"Já paguei"}</label>
          <label style={{ display:"flex",alignItems:"center",gap:7,fontSize:12.5,color:COLORS.inkSoft }}><input type="checkbox" checked={form.recorrente} onChange={e=>setForm(f=>({...f,recorrente:e.target.checked}))}/>Conta recorrente</label>
          {form.recorrente && <select value={form.periodicidade} onChange={e=>setForm(f=>({...f,periodicidade:e.target.value}))} style={fieldStyle}><option value="mensal">Mensal</option><option value="semanal">Semanal</option><option value="anual">Anual</option></select>}
          <div style={{ gridColumn:"1 / -1",display:"flex",gap:8 }}><PrimaryButton type="submit" loading={saving}>Salvar lançamento</PrimaryButton><GhostButton type="button" onClick={()=>setShowForm(false)}>Cancelar</GhostButton></div>
        </form>
      </Card>}

      {section === "contas" && <>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}><SectionLabel>Contas fixas e a pagar</SectionLabel><button onClick={() => openNewTransaction("saida", true)} className="font-body sd-btn" style={{background:"none",border:"none",color:COLORS.primary,fontSize:12,fontWeight:800,cursor:"pointer"}}><Plus size={13}/> Cadastrar</button></div>
        {pendingBills.length === 0 ? <Card style={{padding:18,textAlign:"center",color:COLORS.inkFaint,fontSize:13}}>Nenhuma conta pendente. Use “Cadastrar” para incluir aluguel, água, luz, internet e outras contas recorrentes.</Card> : <Card style={{ padding:4,marginBottom:20 }}>{pendingBills.map((t,i)=><div key={t.id} className="sd-row" style={{display:"flex",alignItems:"center",gap:10,padding:12,borderBottom:i<pendingBills.length-1?`1px solid ${COLORS.border}`:"none"}}><button onClick={()=>togglePaid(t)} className="sd-check" style={{width:22,height:22,borderRadius:7,border:`1.5px solid ${COLORS.gold}`,background:"transparent",cursor:"pointer"}}/><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700}}>{t.descricao}</div><div style={{fontSize:11,color:COLORS.inkSoft}}>{t.recorrente?`Conta ${t.periodicidade} · `:""}vence {fmtDate(t.vencimento||t.data)}</div></div><strong style={{fontSize:13,color:COLORS.terra}}>{fmtBRL(t.valor)}</strong><button onClick={()=>remove(t)} className="sd-btn" style={{background:"none",border:"none",color:COLORS.inkFaint,cursor:"pointer",padding:3}}><Trash2 size={14}/></button></div>)}</Card>}
      </>}

      {section === "lancamentos" && <>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:9}}><SectionLabel>Movimentações de {period.label.toLowerCase()}</SectionLabel></div>
        {periodTx.length===0?<Card style={{padding:18,textAlign:"center",color:COLORS.inkFaint,fontSize:13}}>Nenhuma entrada ou saída registrada neste período.</Card>:<Card style={{padding:4,overflow:"hidden",marginBottom:18}}>{periodTx.map((t,i)=><div key={t.id} className="sd-row" style={{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderBottom:i<periodTx.length-1?`1px solid ${COLORS.border}`:"none",opacity:t.pago?1:.65}}><button onClick={()=>togglePaid(t)} title={t.pago?"Marcar pendente":"Marcar pago"} className="sd-check" style={{width:21,height:21,borderRadius:7,border:`1.5px solid ${t.pago?COLORS.sage:COLORS.borderStrong}`,background:t.pago?COLORS.sage:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{t.pago&&<Check size={12} color="#fff"/>}</button><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.descricao}</div><div style={{fontSize:10.8,color:COLORS.inkSoft}}>{fmtDate(t.data)} · {t.categoria}{t.formaPagamento?` · ${t.formaPagamento}`:""}{t.recorrente?` · ${t.periodicidade}`:""}</div></div><strong style={{fontSize:13,color:t.tipo==="entrada"?COLORS.sage:COLORS.terra}}>{t.tipo==="entrada"?"+":"−"}{fmtBRL(t.valor)}</strong><button onClick={()=>remove(t)} className="sd-btn" style={{background:"none",border:"none",color:COLORS.inkFaint,cursor:"pointer",padding:3}}><Trash2 size={14}/></button></div>)}</Card>}
      </>}

      {section === "aprenda" && (() => {
        const activeModule = COURSE_MODULES.find(m => m.id === openModuleId);
        const activeLesson = activeModule?.licoes.find(l => l.id === openLessonId);

        if (showCertificate) {
          return (
            <Certificate
              establishment={establishment}
              onClose={() => setShowCertificate(false)}
              onIssue={async () => { setIssuingCert(true); try { await onIssueCertificate(); } finally { setIssuingCert(false); } }}
              issuing={issuingCert}
            />
          );
        }

        if (activeLesson) {
          const done = courseProgress.includes(activeLesson.id);
          const canComplete = answerDraft.trim().length > 0;
          async function saveAndComplete() {
            setSavingAnswer(true);
            try {
              await onSaveAnswer(activeLesson.id, answerDraft.trim());
              if (!done) await onToggleLesson(activeLesson.id);
            } finally { setSavingAnswer(false); }
          }
          return (
            <div className="fade-up">
              <BackRow onBack={() => setOpenLessonId(null)} />
              <h2 className="font-display" style={{ fontSize: 20, margin: "0 0 12px", fontWeight: 600 }}>{activeModule.emoji} {activeLesson.titulo}</h2>
              <Card style={{ padding: 16, marginBottom: 14 }}>
                <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.7 }}>{activeLesson.texto}</div>
              </Card>
              <Card style={{ padding: 16, marginBottom: 14, background: COLORS.bgAlt, boxShadow: "none" }}>
                <SectionLabel>Pra refletir</SectionLabel>
                <div style={{ fontSize: 13, color: COLORS.ink, fontWeight: 700, marginBottom: 10, lineHeight: 1.5 }}>{activeLesson.pergunta}</div>
                <textarea
                  value={answerDraft}
                  onChange={e => setAnswerDraft(e.target.value)}
                  onBlur={() => { if (answerDraft.trim()) onSaveAnswer(activeLesson.id, answerDraft.trim()); }}
                  placeholder="Escreva sua resposta aqui..."
                  rows={4}
                  style={{ ...fieldStyle, background: COLORS.surface, resize: "vertical", lineHeight: 1.55 }}
                />
              </Card>
              <PrimaryButton onClick={saveAndComplete} loading={savingAnswer} disabled={!canComplete && !done} style={{ width: "100%", background: done ? `linear-gradient(155deg, ${COLORS.sage}, #285C3C)` : undefined }}>
                {done ? <><Check size={15} /> Aula concluída</> : "Salvar resposta e concluir"}
              </PrimaryButton>
              {!canComplete && !done && <div style={{ fontSize: 11, color: COLORS.inkFaint, textAlign: "center", marginTop: 8 }}>Escreva sua resposta pra poder concluir a aula.</div>}
            </div>
          );
        }

        if (activeModule) {
          const moduleDone = activeModule.licoes.filter(l => courseProgress.includes(l.id)).length;
          return (
            <div className="fade-up">
              <BackRow onBack={() => setOpenModuleId(null)} />
              <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 4px", fontWeight: 600 }}>{activeModule.emoji} {activeModule.titulo}</h2>
              <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 14 }}>{moduleDone} de {activeModule.licoes.length} aulas concluídas</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
                {activeModule.licoes.map((l, i) => {
                  const done = courseProgress.includes(l.id);
                  return (
                    <SelectCard key={l.id} selected={false} onClick={() => openLesson(l.id)}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <div style={{
                          width: 24, height: 24, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                          background: done ? COLORS.sage : COLORS.bgAlt, color: done ? "#fff" : COLORS.inkFaint, fontSize: 11, fontWeight: 700,
                        }}>{done ? <Check size={12} /> : i + 1}</div>
                        <div style={{ fontWeight: 700, fontSize: 13.5, flex: 1 }}>{l.titulo}</div>
                        <ChevronRight size={15} color={COLORS.inkFaint} />
                      </div>
                    </SelectCard>
                  );
                })}
              </div>
            </div>
          );
        }

        return (
          <div className="fade-up">
            <div style={{ fontSize: 12.5, color: COLORS.inkSoft, lineHeight: 1.55, margin: "1px 0 16px" }}>
              Um mini-curso completo de gestão pra quem toca o próprio negócio — financeiro, pessoal e de negócios. Conclua as {COURSE_TOTAL_LESSONS} aulas e gere seu certificado.
            </div>

            <Card style={{ padding: 14, marginBottom: 16, background: COLORS.bgAlt, boxShadow: "none" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, fontWeight: 700, color: COLORS.ink, marginBottom: 6 }}>
                <span>Seu progresso</span><span>{courseProgress.length} de {COURSE_TOTAL_LESSONS}</span>
              </div>
              <div style={{ height: 9, borderRadius: 99, background: COLORS.surface, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${Math.round((courseProgress.length / COURSE_TOTAL_LESSONS) * 100)}%`, borderRadius: 99, background: `linear-gradient(90deg, ${COLORS.gold}, ${COLORS.accent})`, transition: "width .3s ease" }} />
              </div>
            </Card>

            {courseDone && (
              <Card style={{ padding: 16, marginBottom: 16, background: `linear-gradient(155deg, ${COLORS.gold}, #7A5D2C)`, border: "none" }}>
                <div style={{ fontSize: 26, marginBottom: 4 }}>🎓</div>
                <div className="font-display" style={{ fontSize: 17, color: "#fff", fontWeight: 700, marginBottom: 4 }}>Curso concluído!</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,.9)", marginBottom: 12, lineHeight: 1.5 }}>Você terminou as {COURSE_TOTAL_LESSONS} aulas. Gere seu certificado de conclusão.</div>
                <GhostButton onClick={() => setShowCertificate(true)} style={{ background: "#fff", justifyContent: "center", width: "100%" }}>Ver certificado</GhostButton>
              </Card>
            )}

            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {COURSE_MODULES.map(m => {
                const done = m.licoes.filter(l => courseProgress.includes(l.id)).length;
                return (
                  <SelectCard key={m.id} selected={false} onClick={() => setOpenModuleId(m.id)}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <span style={{ fontSize: 24 }}>{m.emoji}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 14.5 }}>{m.titulo}</div>
                        <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 2 }}>{done} de {m.licoes.length} aulas concluídas</div>
                      </div>
                      <ChevronRight size={16} color={COLORS.inkFaint} />
                    </div>
                  </SelectCard>
                );
              })}
            </div>
          </div>
        );
      })()}

      {section !== "aprenda" && (
        <div style={{ display: "flex", justifyContent: "center", marginTop: 18 }}>
          <button onClick={downloadCsv} className="font-body sd-btn" style={{background:"none",border:"none",color:COLORS.inkFaint,fontSize:11.5,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5,padding:"6px 4px"}}><Download size={12}/> Exportar {period.label.toLowerCase()} em CSV</button>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   CERTIFICADO DE CONCLUSÃO DO CURSO
--------------------------------------------------------- */
function Certificate({ establishment, onClose, onIssue, issuing }) {
  const issuedAt = establishment?.courseCompletedAt;
  const dateLabel = new Date(issuedAt || Date.now()).toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });

  return (
    <div className="fade-up">
      <div className="no-print">
        <BackRow onBack={onClose} />
      </div>

      <div className="certificate-print-area" style={{
        border: `2px solid ${COLORS.gold}`, borderRadius: 20, padding: "34px 24px", textAlign: "center",
        background: `radial-gradient(circle at 50% -10%, ${COLORS.goldSoft}, ${COLORS.surface} 60%)`,
        position: "relative", overflow: "hidden",
      }}>
        <div style={{ position: "absolute", inset: 6, border: `1px solid ${COLORS.gold}66`, borderRadius: 14, pointerEvents: "none" }} />
        <div style={{ fontSize: 34, marginBottom: 6 }}>🎓</div>
        <div className="font-body" style={{ fontSize: 10.5, fontWeight: 800, letterSpacing: "0.14em", color: COLORS.gold, textTransform: "uppercase", marginBottom: 6 }}>Certificado de Conclusão</div>
        <div className="font-display" style={{ fontSize: 20, fontWeight: 600, color: COLORS.ink, marginBottom: 18, lineHeight: 1.3 }}>
          Gestão Financeira, Pessoal <span className="font-display-italic">e de Negócios</span>
        </div>

        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, lineHeight: 1.6, marginBottom: 6 }}>Certificamos que</div>
        <div className="font-display" style={{ fontSize: 24, fontWeight: 700, color: COLORS.primary, marginBottom: 6, lineHeight: 1.25 }}>
          {establishment?.nomeResponsavel || "—"}

function Fidelidade({ data, onAddReward, onUpdateReward, onRemoveReward, onRedeem }) {
  const { clients, rewards = [] } = data;
  const [nome, setNome] = useState("");
  const [custo, setCusto] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [redeemFor, setRedeemFor] = useState(null); // client
  const [redeeming, setRedeeming] = useState(false);

  async function addReward(e) {
    e.preventDefault();
    if (!nome.trim() || !custo) return;
    setSaving(true); setError("");
    try {
      await onAddReward({ nome, custo_pontos: Number(custo) });
      setNome(""); setCusto("");
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  async function removeReward(id) {
    try { await onRemoveReward(id); } catch (err) { setError(err.message); }
  }

  async function redeem(reward) {
    setRedeeming(true); setError("");
    try {
      await onRedeem(redeemFor.id, reward.id);
      setRedeemFor(null);
    } catch (err) { setError(err.message); }
    finally { setRedeeming(false); }
  }

  const ranked = [...clients].sort((a, b) => (b.loyaltyPoints || 0) - (a.loyaltyPoints || 0));
  const totalPoints = clients.reduce((sum, c) => sum + (c.loyaltyPoints || 0), 0);
  const activeClients = clients.filter(c => (c.loyaltyPoints || 0) > 0).length;
  async function addSuggestion(name, points) {
    setSaving(true); setError("");
    try { await onAddReward({ nome: name, custo_pontos: points }); }
    catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Fidelidade</h1>
      <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 16, lineHeight: 1.5 }}>
        Cada cliente ganha 1 ponto automaticamente quando um agendamento é confirmado. Cadastre prêmios trocáveis por pontos.
      </div>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,minmax(0,1fr))", gap: 8, marginBottom: 18 }}>

        <Card style={{ padding: 13, textAlign: "center" }}><div className="font-display" style={{ fontSize: 23, color: COLORS.gold, fontWeight: 650 }}>{activeClients}</div><div style={{ fontSize: 10.5, color: COLORS.inkSoft }}>clientes pontuando</div></Card>
        <Card style={{ padding: 13, textAlign: "center" }}><div className="font-display" style={{ fontSize: 23, color: COLORS.sage, fontWeight: 650 }}>{rewards.length}</div><div style={{ fontSize: 10.5, color: COLORS.inkSoft }}>prêmios</div></Card>
      </div>

      {rewards.length === 0 && (
        <Card style={{ padding: 15, marginBottom: 16, background: COLORS.goldSoft, border: "none", boxShadow: "none" }}>
          <div style={{ fontSize: 13, fontWeight: 800, color: "#5A4420", marginBottom: 8 }}>Comece com um prêmio sugerido</div>
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
            {[["Desconto de R$ 10",10],["Brinde especial",15],["Serviço grátis",30]].map(([n,p]) => <button key={n} disabled={saving} onClick={() => addSuggestion(n,p)} className="font-body sd-btn" style={{ border: "none", borderRadius: 999, padding: "8px 11px", background: COLORS.surface, color: COLORS.primary, fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}><Plus size={11} /> {n} · {p} pts</button>)}

                }}>Resgatar</button>

// Apenas o calendário de dias é gerado no cliente (14 dias corridos
// a partir de hoje) — os HORÁRIOS dentro de cada dia nunca são uma
// lista fixa: eles vêm sempre da RPC get_available_slots, calculada
// em tempo real a partir do horário de funcionamento, folgas/férias/
// bloqueios e agendamentos já existentes no banco.
function nextCalendarDays(n = 14) {
  const out = [];
  const d = new Date();
  for (let i = 0; out.length < n && i < n + 7; i++) {
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
