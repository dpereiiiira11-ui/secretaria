      p_professional_id: profissionalId,
      p_service_id: servicoId,
      p_date: data,
    })
      .then(rows => { if (!cancelled) setSlots((rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean)); })
      .catch(err => { if (!cancelled) setSlotsError(err.message); })
      .finally(() => { if (!cancelled) setSlotsLoading(false); });
    return () => { cancelled = true; };
  }, [servicoId, profissionalId, data, establishment.id]);

  function reset() {
    setStep(1); setCategoriaSelecionada(null); setServicoId(null); setProfissionalId(null); setData(null); setHorario(null);
    setNome(""); setWhatsapp(""); setNascimento(""); setObservacao(""); setDone(false); setError("");
  }

  async function submit(e) {
    e.preventDefault();
    if (!nome.trim() || !whatsapp.trim()) return;
    setSubmitting(true); setError("");
    try {
      await onBook({
        p_establishment_id: establishment.id,
        p_service_id: servicoId,
        p_professional_id: profissionalId,
        p_data: data,
        p_horario: horario + ":00",
        p_cliente_nome: nome,
        p_cliente_whatsapp: whatsapp.replace(/\D/g, ""),
        p_cliente_email: null,
        p_observacao: observacao || null,
        p_data_nascimento: nascimento || null,
      });
      setDone(true);
    } catch (err) {
      setError(err.message);
      // O horário pode ter sido ocupado por outra pessoa entre a
      // escolha e o envio — atualiza a lista de horários livres.
      if (/hor[aá]rio/i.test(err.message)) {
        setHorario(null);
        rest.rpc("get_available_slots", {
          p_establishment_id: establishment.id, p_professional_id: profissionalId,
          p_service_id: servicoId, p_date: data,
        }).then(rows => setSlots((rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean))).catch(() => {});
      }
    }
    finally { setSubmitting(false); }
  }

  if (catalogLoading) {
    return <ClientFrame platformName={establishment.platformName} footer={footer}><FullScreenLoader label="Carregando serviços..." /></ClientFrame>;
  }
  if (catalogError) {
    return <ClientFrame platformName={establishment.platformName} footer={footer}><ErrorBanner message={catalogError} /></ClientFrame>;
  }

  if (done) {
    const servico = services.find(s => s.id === servicoId);
    const prof = professionals.find(p => p.id === profissionalId);
    return (
      <ClientFrame platformName={establishment.platformName} footer={footer}>
        <div className="pop-in" style={{ textAlign: "center", padding: "36px 16px" }}>
          <div style={{
            width: 68, height: 68, borderRadius: "50%", background: COLORS.sageSoft,
            display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px",
            animation: "ringPulse 1.4s ease-out infinite",
          }}>
            <Check size={30} color={COLORS.sage} strokeWidth={2.5} />
          </div>
          <h2 className="font-display" style={{ fontSize: 25, margin: "0 0 8px", fontWeight: 600 }}>Horário solicitado!</h2>
          <p style={{ color: COLORS.inkSoft, fontSize: 14, lineHeight: 1.65, maxWidth: 300, margin: "0 auto 26px" }}>
            {servico?.nome} com {prof?.nome}, em {fmtDate(data)} às {horario}. Você vai receber uma mensagem para confirmar.
          </p>
          <GhostButton onClick={reset}>Agendar outro horário</GhostButton>
        </div>
      </ClientFrame>
    );
  }

  return (
    <ClientFrame platformName={establishment.platformName} footer={footer}>
      <Stepper step={step} labels={stepLabels} />
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      {step === 1 && (
        <div className="fade-up">
          {services.length === 0 && <div style={{ color: COLORS.inkFaint, fontSize: 13 }}>Nenhum serviço disponível no momento.</div>}

          {serviceCategories.length > 1 && !categoriaSelecionada ? (
            <>
              <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>O que você procura?</h2>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
                {serviceCategories.map(cat => (
                  <SelectCard key={cat} selected={false} onClick={() => setCategoriaSelecionada(cat)} style={{ textAlign: "center", padding: "18px 10px" }}>
                    <div className="font-display" style={{ fontWeight: 700, fontSize: 15 }}>{cat}</div>
                    <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 3 }}>
                      {servicesByCategory[cat].length} serviço{servicesByCategory[cat].length !== 1 ? "s" : ""}
                    </div>
                  </SelectCard>
                ))}
              </div>
            </>
          ) : (
            <>
              {serviceCategories.length > 1 && (
                <BackRow onBack={() => setCategoriaSelecionada(null)} />
              )}
              <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>
                {categoriaSelecionada || "Escolha o serviço"}
              </h2>
              <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
                {(categoriaSelecionada ? servicesByCategory[categoriaSelecionada] || [] : services).map(sv => (
                  <SelectCard key={sv.id} selected={servicoId === sv.id} onClick={() => { setServicoId(sv.id); setStep(2); }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 14.5 }}>{sv.nome}</div>
                        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{formatDuration(sv.duracao)}</div>
                      </div>
                      <div className="font-display" style={{ fontSize: 16, fontWeight: 600, color: COLORS.primary }}>R$ {sv.preco}</div>
                    </div>
                  </SelectCard>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {step === 2 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(1)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Escolha a profissional</h2>
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {professionals.map(p => (
              <SelectCard key={p.id} selected={profissionalId === p.id} onClick={() => { setProfissionalId(p.id); setStep(3); }}>
                <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
                  <Avatar name={p.nome} size={36} />
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>{p.nome}</div>
                </div>
              </SelectCard>
            ))}
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(2)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Escolha a data</h2>
          <Card style={{ padding: 14, marginBottom: 18 }}>
            <MonthCalendar
              year={viewYear} month={viewMonth}
              onNavigate={(delta) => { const n = addMonths(viewYear, viewMonth, delta); setViewYear(n.year); setViewMonth(n.month); }}
              selectedDate={data}
              onSelectDate={setData}
              minDate={minBookDate}
              maxDate={maxBookDate}
            />
          </Card>
          {data && (
            <>
              <h2 className="font-display" style={{ fontSize: 18, margin: "0 0 12px", fontWeight: 600 }}>Escolha o horário</h2>
              {slotsLoading && <div style={{ color: COLORS.inkFaint, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}><Spinner size={14} color={COLORS.inkFaint} /> Verificando disponibilidade real...</div>}
              {!slotsLoading && slotsError && <ErrorBanner message={slotsError} />}
              {!slotsLoading && !slotsError && slots.length === 0 && (
                <div style={{ color: COLORS.inkFaint, fontSize: 13 }}>Nenhum horário livre nesta data. Tente outro dia.</div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 9 }}>
                {slots.map(h => (
                  <SelectCard key={h} selected={horario === h} onClick={() => { setHorario(h); setStep(4); }} style={{ textAlign: "center", padding: "13px 6px" }}>
                    <div className="font-display" style={{ fontWeight: 700, fontSize: 14.5 }}>{h}</div>
                  </SelectCard>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {step === 4 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(3)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Seus dados</h2>
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <input placeholder="Seu nome" value={nome} onChange={e => setNome(e.target.value)} style={fieldStyle} />
            <input placeholder="WhatsApp (com DDD)" value={whatsapp} onChange={e => setWhatsapp(e.target.value)} style={fieldStyle} />
            <div>
              <label style={{ fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}>Data de nascimento (opcional)</label>
              <input type="date" value={nascimento} onChange={e => setNascimento(e.target.value)} style={{ ...fieldStyle, marginTop: 4 }} />
            </div>
            <textarea placeholder="Observação (opcional)" value={observacao} onChange={e => setObservacao(e.target.value)} rows={3} style={{ ...fieldStyle, resize: "vertical" }} />
            <PrimaryButton type="submit" loading={submitting} disabled={!nome.trim() || !whatsapp.trim()} style={{ width: "100%", marginTop: 6 }}>
              Confirmar solicitação
            </PrimaryButton>
          </form>
        </div>
      )}
    </ClientFrame>
  );
}

function Row({ label, value, last }) {

function Banner({ tone, text }) {
  const bg = tone === "sage" ? COLORS.sageSoft : COLORS.terraSoft;
  const fg = tone === "sage" ? COLORS.sage : COLORS.terra;
  return (
    <div className="pop-in" style={{ background: bg, color: fg, borderRadius: 11, padding: "13px 14px", fontWeight: 700, fontSize: 13.5, textAlign: "center" }}>

function ConfirmationLinkPage({ token, info, loading, error, onResolve, onClose }) {
  const [busy, setBusy] = useState(false);
  const [localStatus, setLocalStatus] = useState(null);

  async function decide(status) {
    setBusy(true);
    try {
      await onResolve(token, status);
      setLocalStatus(status);
    } catch (err) { /* surfaced via error state upstream */ }
    finally { setBusy(false); }
  }

  const status = localStatus || info?.status;

  return (
    <div className="font-body" style={{ minHeight: "100%", background: COLORS.bg, display: "flex", flexDirection: "column" }}>
      {onClose && (
        <div style={{ padding: "16px 18px" }}>
          <button onClick={onClose} className="font-body sd-btn" style={{ background: "transparent", border: "none", color: COLORS.inkSoft, display: "flex", alignItems: "center", gap: 4, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
            <ArrowLeft size={15} /> Fechar link
          </button>
        </div>
      )}
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        {loading ? (
          <FullScreenLoader label="Carregando seu horário..." />
        ) : error ? (
          <Card className="pop-in" style={{ padding: 28, maxWidth: 360, width: "100%" }}>
            <ErrorBanner message={error} />
          </Card>
        ) : info ? (
          <Card className="pop-in" style={{ padding: 28, maxWidth: 360, width: "100%", boxShadow: COLORS.shadowLg }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <Avatar name={info.cliente_nome} size={46} />
              <h2 className="font-display" style={{ fontSize: 21, margin: "12px 0 3px", fontWeight: 600 }}>Olá, {info.cliente_nome?.split(" ")[0]}!</h2>
              <p style={{ color: COLORS.inkSoft, fontSize: 13, margin: 0 }}>Confirme ou cancele seu horário abaixo.</p>
            </div>

            <div style={{ background: COLORS.bgAlt, borderRadius: 13, padding: "6px 14px", marginBottom: 20 }}>
              <Row label="Data" value={fmtDate(info.data)} />
              <Row label="Horário" value={(info.horario || "").slice(0, 5)} />
              <Row label="Serviço" value={info.servico_nome} />
              <Row label="Profissional" value={info.profissional_nome} last />
            </div>

            {status === "confirmado" && <Banner tone="sage" text="Você confirmou este horário. ✅" />}
            {status === "cancelado" && <Banner tone="terra" text="Você cancelou este horário. ❌" />}

            {status === "aguardando" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <PrimaryButton onClick={() => decide("confirmado")} loading={busy} style={{ background: `linear-gradient(155deg, ${COLORS.sage}, #285C3C)`, boxShadow: "0 8px 20px -8px rgba(62,122,85,0.45)" }}>
                  <Check size={16} /> Confirmar horário
                </PrimaryButton>
                <button disabled={busy} onClick={() => decide("cancelado")} className="font-body sd-btn" style={{
                  background: "transparent", border: `1.5px solid ${COLORS.terra}66`, color: COLORS.terra,
                  borderRadius: 999, padding: "13px 20px", fontWeight: 650, fontSize: 14, cursor: "pointer",
                }}>
                  <X size={16} style={{ verticalAlign: -3, marginRight: 6 }} /> Cancelar horário
                </button>
              </div>
            )}
          </Card>
        ) : null}
      </div>
    </div>
  );
}

function EstablishmentFormModal({ initial, plans, onSave, onClose }) {
  const [form, setForm] = useState(initial || {
    nome_estabelecimento: "", nome_responsavel: "", whatsapp: "", email: "", senha: "", plan_id: "",
  });
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const isNew = !initial;

  async function submit(e) {
    e.preventDefault();
    setSaving(true); setError("");
    try {
      await onSave(form);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50,
      display: "flex", alignItems: "flex-end", justifyContent: "center",
    }} onClick={onClose}>
      <div className="pop-in" style={{ width: "100%", maxWidth: 480 }} onClick={e => e.stopPropagation()}>
        <Card style={{ padding: 22, borderRadius: "22px 22px 0 0", maxHeight: "85vh", overflowY: "auto" }}>
          <h2 className="font-display" style={{ fontSize: 20, margin: "0 0 16px", fontWeight: 600 }}>
            {isNew ? "Novo estabelecimento" : "Editar estabelecimento"}
          </h2>
          <ErrorBanner message={error} onDismiss={() => setError("")} />
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <input placeholder="Nome do estabelecimento" value={form.nome_estabelecimento} onChange={e => setForm(f => ({ ...f, nome_estabelecimento: e.target.value }))} style={fieldStyle} />
            <input placeholder="Nome da responsável" value={form.nome_responsavel} onChange={e => setForm(f => ({ ...f, nome_responsavel: e.target.value }))} style={fieldStyle} />
            <input placeholder="WhatsApp" value={form.whatsapp} onChange={e => setForm(f => ({ ...f, whatsapp: e.target.value }))} style={fieldStyle} />
            <input placeholder="E-mail" type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} disabled={!isNew} style={{ ...fieldStyle, opacity: isNew ? 1 : 0.6 }} />
            {isNew && <input placeholder="Senha inicial" type="password" value={form.senha} onChange={e => setForm(f => ({ ...f, senha: e.target.value }))} style={fieldStyle} />}
            <select value={form.plan_id || ""} onChange={e => setForm(f => ({ ...f, plan_id: e.target.value }))} style={fieldStyle}>
              <option value="">Sem plano definido</option>
              {plans.map(p => <option key={p.id} value={p.id}>{p.nome} — R$ {p.preco} ({p.periodicidade})</option>)}
            </select>
            <PrimaryButton type="submit" loading={saving} style={{ marginTop: 4 }}>
              {isNew ? "Criar estabelecimento" : "Salvar alterações"}
            </PrimaryButton>
            <GhostButton onClick={onClose} style={{ justifyContent: "center" }}>Cancelar</GhostButton>
          </form>
        </Card>
      </div>
    </div>
  );
}

function BlockModal({ establishment, onConfirm, onClose }) {
  const [reason, setReason] = useState("");
  const [saving, setSaving] = useState(false);
  const blocking = establishment.status !== "bloqueado";

  async function confirm() {
    setSaving(true);
    try { await onConfirm(blocking ? "bloqueado" : "ativo", blocking ? reason : null); onClose(); }
    finally { setSaving(false); }
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>
      <Card className="pop-in" style={{ padding: 22, maxWidth: 360, width: "100%" }} onClick={e => e.stopPropagation()}>
        <h2 className="font-display" style={{ fontSize: 19, margin: "0 0 10px", fontWeight: 600 }}>
          {blocking ? "Bloquear" : "Desbloquear"} {establishment.nomeEstabelecimento}?
        </h2>
        {blocking ? (
          <>
            <p style={{ fontSize: 13, color: COLORS.inkSoft, margin: "0 0 12px" }}>
              O painel e a agenda pública deste estabelecimento ficam inacessíveis até o desbloqueio.
            </p>
            <textarea placeholder="Motivo (opcional)" value={reason} onChange={e => setReason(e.target.value)} rows={3} style={{ ...fieldStyle, resize: "vertical", marginBottom: 14 }} />
          </>
        ) : (
          <p style={{ fontSize: 13, color: COLORS.inkSoft, margin: "0 0 14px" }}>O acesso será restaurado imediatamente.</p>
        )}
        <div style={{ display: "flex", gap: 8 }}>
          <GhostButton onClick={onClose} style={{ flex: 1, justifyContent: "center" }}>Cancelar</GhostButton>
          <PrimaryButton onClick={confirm} loading={saving} style={{ flex: 1, background: blocking ? `linear-gradient(155deg, ${COLORS.terra}, #7A2A2A)` : undefined }}>
            {blocking ? "Bloquear" : "Desbloquear"}
          </PrimaryButton>
        </div>
      </Card>
    </div>
  );
}

  const [busyId, setBusyId] = useState(null);

  const filtered = establishments.filter(e => {
    if (statusFilter !== "todos" && e.status !== statusFilter) return false;
    if (query && !`${e.nomeEstabelecimento} ${e.nomeResponsavel}`.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });

  async function handleCreate(form) {
    await saActions.createEstablishment(form);
    setEditing(null);

  async function handleUpdate(form) {
    await saActions.updateEstablishment(editing.id, form);
    setEditing(null);
  }

    setError("");
    try { await saActions.setStatus(blockTarget.id, status, reason); }
    catch (err) { setError(err.message); }
  }
  async function handleDelete() {
    setBusyId(deleteTarget.id); setError("");

    catch (err) { setError(err.message); }
    finally { setBusyId(null); }

function SuperAdminPlans({ plans, saActions }) {
  const [form, setForm] = useState({ nome: "", periodicidade: "mensal", preco: "" });
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    if (!form.nome.trim()) return;
    setSaving(true); setError("");
    try {
      const payload = { nome: form.nome, periodicidade: form.periodicidade, preco: Number(form.preco) || 0 };
      if (editingId) await saActions.updatePlan(editingId, payload);
      else await saActions.addPlan(payload);
      setForm({ nome: "", periodicidade: "mensal", preco: "" });
      setEditingId(null);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function edit(p) { setEditingId(p.id); setForm({ nome: p.nome, periodicidade: p.periodicidade, preco: String(p.preco) }); }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Planos</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />
      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>{editingId ? "Editar plano" : "Novo plano"}</SectionLabel>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do plano" value={form.nome} onChange={e => setForm(f => ({ ...f, nome: e.target.value }))} style={fieldStyle} />
          <select value={form.periodicidade} onChange={e => setForm(f => ({ ...f, periodicidade: e.target.value }))} style={fieldStyle}>
            <option value="mensal">Mensal</option>
            <option value="trimestral">Trimestral</option>
            <option value="semestral">Semestral</option>
            <option value="anual">Anual</option>
          </select>
          <input placeholder="Preço (R$)" type="number" value={form.preco} onChange={e => setForm(f => ({ ...f, preco: e.target.value }))} style={fieldStyle} />
          <PrimaryButton type="submit" loading={saving}><Plus size={15} /> {editingId ? "Salvar" : "Adicionar plano"}</PrimaryButton>
        </form>
      </Card>
      <Card style={{ padding: 4, overflow: "hidden" }}>
        {plans.map((p, i) => (
          <div key={p.id} className="sd-row" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 12px", borderBottom: i < plans.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10 }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{p.nome}</div>
              <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>R$ {p.preco} · {p.periodicidade}</div>
            </div>
            <button onClick={() => edit(p)} className="sd-btn" style={{ background: COLORS.primarySoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.primary }}>
              <Pencil size={13.5} style={{ display: "block", margin: "0 auto" }} />
            </button>
          </div>
        ))}
      </Card>
    </div>
  );
}

function SuperAdminAnnouncements({ announcements, saActions }) {

/* ---------------------------------------------------------
   ROOT APP — sessão, roteamento público e integração real
   com o Supabase (Auth + PostgREST + RPCs do schema).
--------------------------------------------------------- */
const emptyData = { clients: [], services: [], professionals: [], appointments: [], shoppingList: [], workingHours: [], timeOff: [], rewards: [], transactions: [], goals: [] };

export default function App() {
  // URL público: ?token=<confirmation_token> (link de confirmação)
  //              ?estab=<slug> (página pública de agendamento)
  const urlParams = useMemo(() => new URLSearchParams(window.location.search), []);
  const urlToken = urlParams.get("token");
  const urlEstab = urlParams.get("estab");

  // Supabase redireciona o link de "esqueci minha senha" com
  // #access_token=...&type=recovery na URL (hash, não query string).
  const hashParams = useMemo(() => new URLSearchParams(window.location.hash.replace(/^#/, "")), []);
  const recoveryToken = hashParams.get("type") === "recovery" ? hashParams.get("access_token") : null;

  const [view, setView] = useState(
    recoveryToken ? "reset-password" : urlToken ? "confirm" : urlEstab ? "client-public" : "landing"
  );

  // Sessão (em memória — sem localStorage, conforme restrição do ambiente)
  const [session, setSession] = useState(null); // { accessToken, userId }
  const [authLoading, setAuthLoading] = useState(false);
  const [authError, setAuthError] = useState("");

  const [establishment, setEstablishment] = useState(null);
  const [data, setData] = useState(emptyData);
  const [dataLoading, setDataLoading] = useState(false);
  const [dataError, setDataError] = useState("");

  const [clientPreview, setClientPreview] = useState(false); // "Ver como cliente" dentro do painel

  const [publicEstablishment, setPublicEstablishment] = useState(null);
  const [publicCatalog, setPublicCatalog] = useState(null);
  const [publicCatalogLoading, setPublicCatalogLoading] = useState(false);
  const [publicCatalogError, setPublicCatalogError] = useState("");

  const [confirmInfo, setConfirmInfo] = useState(null);
  const [confirmLoading, setConfirmLoading] = useState(false);
  const [confirmError, setConfirmError] = useState("");

  // Nível 1 — Super Admin
  const [saSession, setSaSession] = useState(null); // { accessToken, userId }
  const [saEstablishments, setSaEstablishments] = useState([]);
  const [saPlans, setSaPlans] = useState([]);
  const [saAnnouncements, setSaAnnouncements] = useState([]);
  const [saLogs, setSaLogs] = useState([]);
  const [saDataLoading, setSaDataLoading] = useState(false);

  /* ---------------- Carregar dados do tenant autenticado ---------------- */
  const [announcements, setAnnouncements] = useState([]);

  const loadTenantData = useCallback(async (token) => {
    setDataLoading(true); setDataError("");
    try {
      const [profs, servs, cls, appts, shop, ann, wh, to, rw, tx, goals] = await Promise.all([
        rest.select("professionals", "?select=*&order=created_at.asc", token),
        rest.select("services", "?select=*&order=created_at.asc", token),
        rest.select("clients", "?select=*&order=created_at.asc", token),
        rest.select("appointments", "?select=*&order=data.asc,horario.asc", token),
        rest.select("shopping_list_items", "?select=*&order=created_at.asc", token),
        rest.select("announcements", "?select=*&order=created_at.desc&limit=3", token).catch(() => []),
        rest.select("working_hours", "?select=*", token),
        rest.select("time_off", "?select=*&order=start_at.asc", token),
        rest.select("loyalty_rewards", "?select=*&order=custo_pontos.asc", token).catch(() => []),
        rest.select("financial_transactions", "?select=*&order=data.desc,created_at.desc", token).catch(() => []),
        rest.select("financial_goals", "?select=*&order=created_at.asc", token).catch(() => []),
      ]);
      setData({
        professionals: profs.map(mapProfessional),
        services: servs.map(mapService),
        clients: cls.map(mapClient),
        appointments: appts.map(mapAppointment),
        shoppingList: shop.map(mapShopping),
        workingHours: wh.map(mapWorkingHour),
        timeOff: to.map(mapTimeOff),
        rewards: rw.map(mapReward),
        transactions: tx.map(mapTransaction),
        goals: goals.map(mapGoal),
      });
      setAnnouncements(ann);
    } catch (err) {
      setDataError(err.message);
    } finally {
      setDataLoading(false);
    }
  }, []);

  const loadSessionAndData = useCallback(async (accessToken, userId, refreshToken) => {
    const rows = await rest.select("establishments", `?user_id=eq.${userId}&select=*`, accessToken);
    if (!rows || rows.length === 0) {
      throw new Error("Não encontramos um estabelecimento vinculado a esta conta.");
    }
    const est = mapEstablishment(rows[0]);
    setEstablishment(est);
    setSession({ accessToken, userId });
    if (refreshToken) savePersistedSession({ kind: "tenant", accessToken, refreshToken, userId });
    if (est.status === "bloqueado") {
      setView("blocked");
      return;
    }
    await loadTenantData(accessToken);
    setView("admin");
  }, [loadTenantData]);

  /* ---------------- Login / Signup ---------------- */
  async function handleLogin(email, password) {
    setAuthLoading(true); setAuthError("");
    try {
      const resp = await auth.signIn(email, password);
      await loadSessionAndData(resp.access_token, resp.user.id, resp.refresh_token);
    } catch (err) {
      setAuthError(translateAuthError(err));
    } finally {
      setAuthLoading(false);
    }
  }

  async function handleResendConfirmation(email) {
    if (!email) return;
    try { await auth.resendConfirmation(email); } catch { /* silencioso: não vaza se o e-mail existe ou não */ }
  }

  async function handleForgotPassword(email) {
    setView("recover");
  }

  async function handleSendRecovery(email) {
    setAuthLoading(true); setAuthError("");
    try { await auth.recover(email); }
    catch (err) { setAuthError(translateAuthError(err)); }
    finally { setAuthLoading(false); }
  }

  async function handleResetPassword(newPassword) {
    setAuthLoading(true); setAuthError("");
    try {
      await auth.updatePassword(recoveryToken, newPassword);
    } catch (err) {
      setAuthError(translateAuthError(err));
      throw err;
    } finally {
      setAuthLoading(false);
    }
  }

  async function handleSignup(form) {
    setAuthLoading(true); setAuthError("");
    try {
      const resp = await auth.signUp(form.email, form.senha);
      let accessToken = resp.access_token;
      let refreshToken = resp.refresh_token;
      let userId = resp.user?.id || resp.id;

      if (!accessToken) {
        // Confirmação de e-mail pode estar ativada — tenta logar direto como fallback.
        try {
          const signInResp = await auth.signIn(form.email, form.senha);
          accessToken = signInResp.access_token;
          refreshToken = signInResp.refresh_token;
          userId = signInResp.user.id;
        } catch {
          setAuthError("Conta criada! Verifique seu e-mail para confirmar o acesso e depois faça login.");
          setView("login");
          setAuthLoading(false);
          return;
        }
      }

      const slug = `${slugify(form.estabelecimento)}-${Math.random().toString(36).slice(2, 6)}`;
      const [estRow] = await rest.insert("establishments", {
        user_id: userId,
        platform_name: "Secretária Digital",
        nome_estabelecimento: form.estabelecimento,
        nome_responsavel: form.responsavel,
        whatsapp: form.whatsapp.replace(/\D/g, ""),
        email: form.email,
        slug,
      }, accessToken);

      if (!estRow || !estRow.id) {
        throw new Error("O estabelecimento não foi criado. Verifique se o schema-completo.sql foi executado neste projeto Supabase.");
      }

      // Cria a profissional responsável automaticamente para a agenda já funcionar.
      await rest.insert("professionals", {
        establishment_id: estRow.id,
        nome: form.responsavel,
      }, accessToken);

      // Horário de funcionamento padrão (seg-sáb, 09h-19h, almoço 12h-13h)
      // para a agenda inteligente já calcular disponibilidade real.
      await rest.rpc("seed_default_working_hours", { p_establishment_id: estRow.id }, accessToken);

      setEstablishment(mapEstablishment(estRow));
      setSession({ accessToken, userId });
      if (refreshToken) savePersistedSession({ kind: "tenant", accessToken, refreshToken, userId });
      await loadTenantData(accessToken);
      setView("admin");
    } catch (err) {
      setAuthError(translateAuthError(err));
    } finally {
      setAuthLoading(false);
    }
  }

  /* ---------------- Ações do painel (CRUD real) ---------------- */

    redeemReward: async (clientId, rewardId) => {
      await rest.rpc("redeem_loyalty_reward", { p_client_id: clientId, p_reward_id: rewardId }, session.accessToken);
      await loadTenantData(session.accessToken);
    },
    // Importação rápida em blocos. Se um bloco falhar, tenta os contatos
    // daquele bloco individualmente para mostrar o erro real sem perder
    // os demais contatos válidos.
    addClient: async (payload) => {
      const [row] = await rest.insert("clients", { ...payload, establishment_id: establishment.id }, session.accessToken);
      setData(d => ({ ...d, clients: [...d.clients, mapClient(row)] }));
    },
    importClients: async (rows) => {
      const token = session.accessToken;
      const seen = new Set(data.clients.map(c => normalizeImportedPhone(c.whatsapp)));
      const pending = [];
      let created = 0, duplicated = 0, invalid = 0, failed = 0, firstError = "";
      for (const row of rows) {
        const whatsapp = normalizeImportedPhone(row.whatsapp);
        const nome = (row.nome || "").trim();
        if (!nome || !whatsapp) { invalid++; continue; }
        if (seen.has(whatsapp)) { duplicated++; continue; }
        seen.add(whatsapp);
        const contact = { establishment_id: establishment.id, nome, whatsapp };
        const nascimento = normalizeImportedDate(row.data_nascimento);
        // Não envia a coluna vazia: nome e telefone bastam para criar a cliente.
        if (nascimento) contact.data_nascimento = nascimento;
        pending.push(contact);
      }
      for (let i = 0; i < pending.length; i += 100) {
        const batch = pending.slice(i, i + 100);
        try {
          const inserted = await rest.insert("clients", batch, token);
          created += Array.isArray(inserted) ? inserted.length : batch.length;
        } catch (batchError) {
          for (const contact of batch) {
            try { await rest.insert("clients", contact, token); created++; }
            catch (err) {
              // Já existe uma cliente com esse WhatsApp neste estabelecimento
              // (ex.: uma segunda tentativa de importar o mesmo arquivo).
              if (/duplicate key|already exists|unique constraint/i.test(err.message || "")) { duplicated++; }
              else { failed++; if (!firstError) firstError = err.message || "Falha ao salvar contato"; }
            }
          }
        }
      }
      await loadTenantData(token);
      return { created, duplicated, invalid, failed, firstError };
    },
    saveWorkingHours: async (professionalId, days) => {
      const token = session.accessToken;
      const existing = data.workingHours.filter(w => (w.professionalId || null) === (professionalId || null));
      const ops = days.map(day => {
        const existingRow = existing.find(w => w.weekday === day.weekday);
        if (day.open) {
          const payload = {
            establishment_id: establishment.id,
            professional_id: professionalId,
            weekday: day.weekday,
            start_time: day.start,
            end_time: day.end,
            break_start: day.hasBreak ? day.breakStart : null,
            break_end: day.hasBreak ? day.breakEnd : null,
          };
          return existingRow
            ? rest.update("working_hours", `?id=eq.${existingRow.id}`, payload, token)
            : rest.insert("working_hours", payload, token);
        }
        return existingRow ? rest.remove("working_hours", `?id=eq.${existingRow.id}`, token) : Promise.resolve(null);
      });
      await Promise.all(ops);
      const profFilter = professionalId ? `professional_id=eq.${professionalId}` : `professional_id=is.null`;
      const rows = await rest.select("working_hours", `?establishment_id=eq.${establishment.id}&${profFilter}&select=*`, token);
      setData(d => ({
        ...d,
        workingHours: [
          ...d.workingHours.filter(w => (w.professionalId || null) !== (professionalId || null)),
          ...rows.map(mapWorkingHour),
        ],
      }));
    },

    addShoppingItem: async (payload) => {

    toggleShoppingItem: async (id, payload) => {

      if (payload.comprado) {
        const body = {
          establishment_id: establishment.id, tipo: "saida", descricao: `Compra: ${row.nome}`,
          categoria: row.categoria || "Outros", valor: Number(payload.valor_gasto || 0),
          forma_pagamento: payload.forma_pagamento || null, data: payload.comprado_em || todayIso(),
          pago: true, shopping_item_id: id,

        const existing = data.transactions.find(t => t.shoppingItemId === id);
        if (existing) await rest.update("financial_transactions", `?id=eq.${existing.id}`, body, session.accessToken);
        else await rest.insert("financial_transactions", body, session.accessToken);
      } else {
        await rest.remove("financial_transactions", `?shopping_item_id=eq.${id}`, session.accessToken);

      await loadTenantData(session.accessToken);

    removeShoppingItem: async (id) => {

    addTransaction: async (payload) => {

      if (payload.appointment_id && payload.tipo === "entrada") {

        }, session.accessToken);

      await loadTenantData(session.accessToken);

    updateTransaction: async (id, payload) => {
      await rest.update("financial_transactions", `?id=eq.${id}`, payload, session.accessToken);
      await loadTenantData(session.accessToken);
    },
    removeTransaction: async (id) => {
      await rest.remove("financial_transactions", `?id=eq.${id}`, session.accessToken);
      await loadTenantData(session.accessToken);

    addGoal: async (payload) => {
      await rest.insert("financial_goals", { ...payload, establishment_id: establishment.id }, session.accessToken);
      await loadTenantData(session.accessToken);

    updateGoal: async (id, payload) => {
      await rest.update("financial_goals", `?id=eq.${id}`, payload, session.accessToken);

      setEstablishment(mapEstablishment(row));

  /* ---------------- Página pública de agendamento (?estab=slug) ---------------- */
  useEffect(() => {

    (async () => {

  /* ---------------- Restaura sessão salva ao atualizar a página ---------------- */
  const [sessionRestoring, setSessionRestoring] = useState(() => {
    if (recoveryToken || urlToken || urlEstab) return false;
    return !!loadPersistedSession();
  });

  useEffect(() => {
    if (!sessionRestoring) return;
    const saved = loadPersistedSession();
    if (!saved) { setSessionRestoring(false); return; }

    async function restoreWithToken(accessToken, refreshToken, userId) {
      if (saved.kind === "superadmin") {
        const isAdmin = await rest.select("super_admins", `?user_id=eq.${userId}&select=user_id`, accessToken);
        if (!isAdmin || isAdmin.length === 0) throw new Error("Sem acesso de administrador");
        savePersistedSession({ kind: "superadmin", accessToken, refreshToken, userId });
        setSaSession({ accessToken, userId });
        await loadSuperAdminData(accessToken);
        setView("superadmin");
      } else {
        await loadSessionAndData(accessToken, userId, refreshToken);
      }
    }

    (async () => {
      try {
        await restoreWithToken(saved.accessToken, saved.refreshToken, saved.userId);
      } catch {
        // Token de acesso pode ter expirado — tenta renovar com o refresh token.
        if (saved.refreshToken) {
          try {
            const resp = await auth.refresh(saved.refreshToken);
            await restoreWithToken(resp.access_token, resp.refresh_token, resp.user?.id || saved.userId);
          } catch {
            clearPersistedSession();
          }
        } else {
          clearPersistedSession();
        }
      } finally {
        setSessionRestoring(false);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

      );

    return <div style={{ minHeight: "100vh", background: COLORS.bg }}>{FONTS}{body}</div>;
  }

  let body;
  if (view === "landing") {
    body = <Landing onCreateAccount={() => setView("signup")} onEnter={() => setView("login")} onSuperAdmin={() => setView("superadmin-login")} />;
  } else if (view === "login") {
    body = (
      <LoginForm
        loading={authLoading} error={authError} onLogin={handleLogin}
        onBack={() => setView("landing")} onGoSignup={() => setView("signup")}
        onForgotPassword={handleForgotPassword} onResendConfirmation={handleResendConfirmation}
      />
    );
  } else if (view === "signup") {
    body = <Signup loading={authLoading} error={authError} onCreate={handleSignup} onBack={() => setView("landing")} onGoLogin={() => setView("login")} />;
  } else if (view === "superadmin-login") {
    body = (
      <SuperAdminLogin
        loading={authLoading} error={authError} onLogin={handleSuperAdminLogin}
        onBack={() => setView("landing")} onForgotPassword={handleForgotPassword}
      />
    );
  } else if (view === "recover") {
    body = <RecoverForm loading={authLoading} error={authError} onSend={handleSendRecovery} onBack={() => setView("landing")} />;
  } else if (view === "reset-password") {
    body = <ResetPasswordForm loading={authLoading} error={authError} onReset={handleResetPassword} />;
  } else if (view === "superadmin") {
    body = saDataLoading && saEstablishments.length === 0
      ? <FullScreenLoader label="Carregando painel administrativo..." />
      : (
        <SuperAdminApp
          establishments={saEstablishments}
          plans={saPlans}
          announcements={saAnnouncements}
          logs={saLogs}
          saActions={saActions}
          onSignOut={handleSuperAdminSignOut}
        />
      );
  } else if (view === "blocked") {
    body = <BlockedScreen establishment={establishment} onSignOut={handleSignOut} />;
  } else if (view === "admin") {
    if (dataLoading && data === emptyData) {
      body = <FullScreenLoader label="Carregando seu painel..." />;
    } else if (clientPreview) {
      const previewCatalog = {
        services: data.services.filter(s => s.ativo !== false),
        professionals: data.professionals.filter(p => p.ativo !== false),
      };
      body = (
        <ClientBooking
          establishment={establishment}
          catalog={previewCatalog}
          catalogLoading={false}
          catalogError=""
          onBook={bookPublic}
          footer={
            <button onClick={() => setClientPreview(false)} className="font-body sd-btn" style={{ background: "transparent", border: "none", color: COLORS.inkFaint, fontSize: 12, cursor: "pointer", fontWeight: 600 }}>
              ← Voltar ao painel da profissional
            </button>
          }
        />
      );
    } else {
      body = (
        <>
          {dataError && <div style={{ padding: "10px 16px 0" }}><ErrorBanner message={dataError} onDismiss={() => setDataError("")} /></div>}
          <AdminApp
            data={data}
            establishment={establishment}
            actions={actions}
            announcements={announcements}
            onExitToClientDemo={() => setClientPreview(true)}
            onOpenLink={(token) => setPreviewLinkToken(token)}
            onSignOut={handleSignOut}
          />
        </>
      );
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg }}>
      {FONTS}
      {body}
    </div>
  );
}

/* Simula a abertura do link único direto de dentro do painel,
   reutilizando a mesma tela pública/RPC que a cliente veria. */
function PreviewLinkModal({ token, onClose, onResolve }) {
  const [info, setInfo] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    setLoading(true); setError("");
    rest.rpc("get_appointment_by_token", { p_token: token })
      .then(rows => setInfo(rows && rows[0] ? rows[0] : null))
      .catch(err => setError(err.message))
      .finally(() => setLoading(false));
  }, [token]);

  return (
    <ConfirmationLinkPage token={token} info={info} loading={loading} error={error} onResolve={onResolve} onClose={onClose} />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
